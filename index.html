<!DOCTYPE html>
<html>
<script>localStorage.setItem('supabase_url','https://ouiqfudmvivlevmaritc.supabase.co');localStorage.setItem('supabase_anon_key','sb_publishable_hl4HII66qpr5kuwwsA0p1w_Vi-54Ih3');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starlife Agencies - Earn by Viewing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f0f13;color:#fff;padding:15px}
.card{background:#1c1c24;border-radius:16px;padding:20px;margin:15px 0;border:1px solid #2a2a36}
.btn{background:#7c3aed;color:#fff;border:0;padding:12px 20px;border-radius:10px;width:100%;font-weight:700;margin:8px 0}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #2a2a36;background:#12121a;color:#fff;margin:6px 0}
.badge{background:#22c55e22;color:#22c55e;padding:4px 10px;border-radius:20px;font-size:12px}
.small{font-size:13px;opacity:.7}
</style>
</head>
<body>
<h1>📢✨ Starlife Agencies</h1>
<p class="small">Earn by WhatsApp Status Views + Referrals</p>

<div id="setup" class="card" style="border-color:#f59e0b">
<h2>⚙️ Weka Supabase Keys</h2>
<input id="supaUrl" placeholder="https://xxxx.supabase.co">
<input id="supaKey" placeholder="anon key">
<button class="btn" onclick="saveKeys()">Save & Connect</button>
<p id="connStatus" class="small"></p>
</div>

<div id="app" style="display:none">
<div class="card">
<h2>👤 Register / Login</h2>
<input id="phone" placeholder="Phone 07...">
<input id="name" placeholder="Jina lako">
<button class="btn" onclick="register()">Jisajili</button>
<p id="userInfo" class="small"></p>
</div>
<div class="card">
<h2>📦 Packages</h2>
<div id="packages"></div>
</div>
<div class="card">
<h2>💳 Lipa</h2>
<select id="pkgSelect"></select>
<input id="amount" placeholder="Amount 1000">
<input id="mpesaCode" placeholder="M-Pesa Code">
<button class="btn" onclick="submitPayment()">Tuma Payment</button>
<p id="payStatus" class="small"></p>
</div>
<div class="card">
<h2>👁️ Viewer Submission</h2>
<input id="viewLink" placeholder="Link ya Status">
<button class="btn" onclick="submitViewer()">Tuma View</button>
<p id="viewStatus" class="small"></p>
</div>
<div class="card">
<h2>💰 Earnings & Referral</h2>
<p>Balance: <b id="bal">0</b></p>
<p id="refLink" style="word-break:break-all;background:#000;padding:8px;border-radius:8px;font-size:12px;margin:8px 0"></p>
<button class="btn" onclick="copyRef()">Copy Referral Link</button>
</div>
</div>

<script>
let supabase, currentUser=null;
function saveKeys(){
 const url=document.getElementById('supaUrl').value.trim();
 const key=document.getElementById('supaKey').value.trim();
 localStorage.setItem('sUrl',url); localStorage.setItem('sKey',key);
 initSupa(url,key);
}
function initSupa(url,key){
 supabase=window.supabase.createClient(url,key);
 document.getElementById('connStatus').innerText='✅ Connected!';
 document.getElementById('setup').style.display='none';
 document.getElementById('app').style.display='block';
 loadPackages();
}
async function register(){
 const phone=document.getElementById('phone').value.trim();
 const name=document.getElementById('name').value.trim();
 let {data}=await supabase.from('profiles').select('*').eq('phone',phone).maybeSingle();
 if(!data){
  const {data:n, error}=await supabase.from('profiles').insert({phone, full_name:name, balance:0}).select().single();
  if(error){alert(error.message);return}
  data=n;
 }
 currentUser=data;
 localStorage.setItem('user',JSON.stringify(data));
 document.getElementById('userInfo').innerHTML=`✅ ${data.phone}`;
 document.getElementById('refLink').innerText=location.href.split('?')[0]+'?ref='+data.id;
 document.getElementById('bal').innerText=data.balance||0;
}
async function loadPackages(){
 const {data}=await supabase.from('products').select('*');
 const cont=document.getElementById('packages'); const sel=document.getElementById('pkgSelect');
 cont.innerHTML=''; sel.innerHTML='';
 data.forEach(p=>{
  cont.innerHTML+=`<div style="background:#12121a;padding:12px;border-radius:10px;margin:6px 0"><b>${p.name||p.title}</b><br>Price: ${p.price}</div>`;
  sel.innerHTML+=`<option value="${p.id}">${p.name||p.title} - ${p.price}</option>`;
 });
}
async function submitPayment(){
 const pkg=document.getElementById('pkgSelect').value;
 const amount=document.getElementById('amount').value;
 const ref=document.getElementById('mpesaCode').value;
 const {error}=await supabase.from('payment_submissions').insert({member_id:currentUser.id, amount:parseFloat(amount), payment_reference:ref, status:'pending'});
 if(error) document.getElementById('payStatus').innerText='❌ '+error.message;
 else document.getElementById('payStatus').innerText='✅ Imetumwa!';
}
async function submitViewer(){
 const link=document.getElementById('viewLink').value;
 const {error}=await supabase.from('viewer_submissions').insert({member_id:currentUser.id, status_link:link, status:'pending'});
 if(error) document.getElementById('viewStatus').innerText='❌ '+error.message;
 else document.getElementById('viewStatus').innerText='✅ Imetumwa!';
}
function copyRef(){ navigator.clipboard.writeText(document.getElementById('refLink').innerText); alert('Copied!'); }
window.onload=()=>{
 const u=localStorage.getItem('sUrl'), k=localStorage.getItem('sKey');
 if(u&&k){ document.getElementById('supaUrl').value=u; document.getElementById('supaKey').value=k; initSupa(u,k); }
}
</script>
</body>
</html>
