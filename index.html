<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STARLIFE AGENCIES</title>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0;padding:10px}
.card{background:#fff;padding:15px;border-radius:12px;margin:10px 0;box-shadow:0 2px 10px #0001}
button{padding:12px;border:0;border-radius:8px;background:#000;color:#fff;font-weight:700;width:100%;margin-top:8px;cursor:pointer}
input,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
.badge{background:#000;color:#fff;padding:3px 8px;border-radius:20px;font-size:12px}
.paybox{background:#e8f8f5;border:2px dashed #27ae60;padding:10px;border-radius:10px;text-align:center;font-weight:800}
.bonusBox{background:linear-gradient(135deg,#f39c12,#e67e22);color:#fff;padding:15px;border-radius:12px;text-align:center}
</style>
</head>
<body>
<h2>⭐ STARLIFE AGENCIES</h2>
<div class="paybox">JOINING ONLY:<br>PAYBILL 714777 | ACC 440200282954<br>Regular 200 | VIP 350 | Gold 500</div>

<div id="auth" class="card">
<h3>Join / Login</h3>
<input id="jName" placeholder="Full Name">
<input id="jPhone" placeholder="Phone 07...">
<input id="jPass" type="password" placeholder="Password">
<select id="jPkg">
<option value="200|100">Regular - 200 (100/view)</option>
<option value="350|120">VIP - 350 (120/view)</option>
<option value="500|150">GOLD - 500 (150/view)</option>
</select>
<input id="jMpesa" placeholder="M-Pesa Code">
<button onclick="join()">JOIN NOW</button>
<button onclick="login()" style="background:#444">LOGIN</button>
</div>

<div id="dash" style="display:none">
<div class="card"><b id="uName"></b> <span class="badge" id="uStatus"></span><br>Phone: <span id="uPhone"></span><br>PKG: <b id="uPkg"></b></div>
<div class="bonusBox"><h3 style="margin:0">🎉 CASHBACK 5,500</h3><p id="cashStatus"></p><button onclick="claimCash()" id="claimBtn" style="background:#fff;color:#e67e22">CLAIM 5,500 NOW</button></div>
<div class="card">Balance: <b id="uBal"></b> KES<br><button onclick="logout()" style="background:#c00">Logout</button></div>
<div class="card"><h3>Watch & Earn</h3><button onclick="watch()">Watch + Earn</button><div id="vMsg"></div></div>
<div class="card"><h3>Withdraw - NO FEE</h3><input id="wAmount" type="number" placeholder="Min 500"><input id="wPhone" placeholder="M-Pesa Number"><button onclick="reqW()">Request Withdraw</button><div id="wList"></div></div>

<div id="admin" class="card"><h3>Admin</h3><input id="aPass" type="password" placeholder="Admin Password STARLIFE714777"><button onclick="aLogin()">Unlock Admin</button>
<div id="aContent" style="display:none">
<p>Total: <b id="totalCount">0</b> | Pending W: <b id="pendWCount" style="color:red">0</b></p>
<input id="searchPhone" placeholder="Search phone..." oninput="renderAdmin()">
<button onclick="exportCSV()" style="background:#27ae60">Export CSV Proof</button>
<div id="aUsers"></div>
<h4>Withdraws - Notify to 0762221240</h4><div id="aW"></div>
</div>
</div>
</div>

<script>
const ADMIN_WA='254762221240';
let D=JSON.parse(localStorage.getItem('STAR_V5')||'{"users":[],"withdraws":[],"adminPass":"STARLIFE714777","curr":null}');
let U=null;
function save(){localStorage.setItem('STAR_V5',JSON.stringify(D))}
function hash(p){return btoa(p)}
function join(){const n=jName.value.trim(),ph=jPhone.value.trim(),pa=jPass.value.trim(),pkgRaw=jPkg.value,code=jMpesa.value.trim(); if(!n||!ph||!pa||!code)return alert('Fill all'); if(D.users.find(x=>x.phone===ph))return alert('Already joined'); const [pkgPrice,rate]=pkgRaw.split('|'); D.users.push({name:n,phone:ph,passHash:hash(pa),mpesa:code,pkg:pkgPrice,rate:+rate,bal:0,cashClaimed:false,status:'pending',joinedAt:new Date().toLocaleString()}); save(); alert('Joined!'); loginF(ph,pa);}
function login(){loginF(jPhone.value.trim(),jPass.value.trim())}
function loginF(ph,pa){const u=D.users.find(x=>x.phone===ph&&x.passHash===hash(pa)); if(!u)return alert('Wrong'); U=u; D.curr=ph; save(); show()}
function show(){auth.style.display='none';dash.style.display='block';uName.textContent=U.name;uPhone.textContent=U.phone;uStatus.textContent=U.status;uPkg.textContent=U.pkg+' KES ('+U.rate+'/view)';uBal.textContent=U.bal; cashStatus.textContent=U.cashClaimed?'✅ CLAIMED 5,500 added':'🎉 5,500 Cashback - Click CLAIM';claimBtn.style.display=U.cashClaimed?'none':'block'; renderW()}
function logout(){D.curr=null;save();location.reload()}
function claimCash(){if(U.cashClaimed)return alert('Already'); if(U.status!=='active')return alert('Wait approval'); U.bal+=5500; U.cashClaimed=true; save(); show(); alert('5,500 Claimed!');}
function watch(){if(U.status!=='active')return alert('Wait approval'); U.bal+=U.rate; save(); show(); vMsg.innerHTML='+'+U.rate+' added';}
function reqW(){const amt=+wAmount.value,mp=wPhone.value.trim(); if(amt<500)return alert('Min 500'); if(U.bal<amt)return alert('Low bal'); D.withdraws.push({phone:U.phone,name:U.name,amount:amt,mpesaPhone:mp,date:new Date().toLocaleString(),status:'pending',pkg:U.pkg}); U.bal-=amt; save(); show(); const msg=`🔔 WITHDRAW%0AName:${U.name}%0APhone:${U.phone}%0AAmount:${amt}%0ATo:${mp}%0APKG:${U.pkg}`; window.open(`https://wa.me/${ADMIN_WA}?text=${msg}`,'_blank'); alert('Requested - Admin 0762221240 notified');}

function approveUser(phone){const u=D.users.find(x=>x.phone===phone); if(!u)return alert('User not found'); u.status='active'; save(); renderAdmin(); show(); alert('Approved '+u.name+' '+phone)}
function markPaid(phone,dateStr){const w=D.withdraws.find(x=>x.phone===phone && x.date===dateStr); if(!w)return; w.status='paid'; save(); renderAdmin(); alert('Marked paid '+phone)}

function aLogin(){if(aPass.value!=='STARLIFE714777')return alert('Wrong admin pass, use STARLIFE714777'); aContent.style.display='block'; renderAdmin()}
function renderAdmin(){
 const q=(searchPhone.value||'').trim();
 let list=D.users; if(q) list=list.filter(u=>u.phone.includes(q));
 totalCount.textContent=D.users.length;
 pendWCount.textContent=D.withdraws.filter(w=>w.status==='pending').length;
 aUsers.innerHTML=list.map(u=>`<div class="card"><b>${u.name}</b> ${u.phone}<br>PKG:${u.pkg} Bal:${u.bal} Status:${u.status}<br>Joined:${u.joinedAt}<br>Code:${u.mpesa}<br>Pass ***HIDDEN***<br><button onclick="approveUser('${u.phone}')" style="background:#27ae60">✅ APPROVE THIS CLIENT</button></div>`).join('')||'No users';
 aW.innerHTML=D.withdraws.map(w=>`<div class="card" style="border:2px solid red"><b>${w.name} ${w.phone}</b><br>${w.amount} KES To ${w.mpesaPhone}<br>${w.date} [${w.status}]<br><button onclick="markPaid('${w.phone}','${w.date}')" style="background:#25D366">Mark Paid FULL</button></div>`).reverse().join('')||'None';
}
function renderW(){const myW=D.withdraws.filter(w=>w.phone===U.phone); wList.innerHTML=myW.map(w=>`<div class="card">${w.date}: ${w.amount} To ${w.mpesaPhone} [${w.status}]</div>`).join('')}
function exportCSV(){let csv="Name,Phone,Package,Status,Joined,Mpesa,Balance,Cash\n"; D.users.forEach(u=>{csv+=`"${u.name}","${u.phone}","${u.pkg}","${u.status}","${u.joinedAt}","${u.mpesa}","${u.bal}","${u.cashClaimed}"\n`}); const b=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='proof.csv'; a.click();}
if(D.curr){const u=D.users.find(x=>x.phone===D.curr); if(u){U=u;show()}}
</script>
</body>
</html>
