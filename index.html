<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STARLIFE INDICATE 450</title><style>body{font-family:Arial;background:#f5f7fb;padding:10px}.card{background:#fff;padding:12px;border-radius:10px;margin:8px 0;box-shadow:0 2px 8px #0001}button{padding:10px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700;width:100%;margin-top:6px}input,select{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}.fee{color:#d35400;font-weight:700}</style></head><body>
<h2>⭐ STARLIFE AGENCIES</h2>
<div id="auth" class="card"><h3>Join / Login</h3><input id="jName" placeholder="Name"><input id="jPhone" placeholder="Phone"><input id="jPass" type="password" placeholder="Password - hidden & hashed"><select id="jPkg"><option value="500">PKG 500</option><option value="1000">PKG 1000</option><option value="2000">PKG 2000</option></select><input id="jMpesa" placeholder="M-Pesa Code - Paybill 714777 Acc 440200282954"><button onclick="join()">JOIN</button><button onclick="login()">LOGIN</button><br><small>Paybill: 714777 Acc: 440200282954 - For Packages Only</small></div>
<div id="dash" style="display:none"><div class="card"><b id="uName"></b> - <span id="uPhone"></span><br>Balance: <b id="uBal"></b><br><button onclick="logout()">Logout</button></div>
<div class="card"><h3>Withdraw</h3><p class="fee">Platform Fee Indicated: 450 KES</p><p>Note: Fee shown for information only. No extra payment needed to withdraw. You receive full amount.</p><input id="wAmount" type="number" placeholder="Amount"><input id="wPhone" placeholder="Your M-Pesa Number"><button onclick="reqW()">Request Withdraw</button><div id="wList"></div></div>
<div id="admin" class="card"><h3>Admin Panel</h3><input id="aPass" type="password" placeholder="Admin Pass"><button onclick="aLogin()">Unlock Admin</button><div id="aContent" style="display:none"><h4>All Joined Users</h4><div id="aUsers"></div><h4>Pending</h4><div id="aPending"></div><h4>Withdrawals</h4><div id="aW"></div></div></div></div>
<script>
function hash(p){return btoa(p)}
let D=JSON.parse(localStorage.getItem('STAR_IND450')||'{"users":[],"withdraws":[],"adminPass":"STARLIFE714777","curr":null}');let U=null;
function save(){localStorage.setItem('STAR_IND450',JSON.stringify(D))}
function join(){const n=jName.value.trim(),ph=jPhone.value.trim(),pa=jPass.value.trim(),pkg=jPkg.value,code=jMpesa.value.trim();if(!n||!ph||!pa||!code)return alert('fill all');if(D.users.find(x=>x.phone===ph))return alert('exists');D.users.push({name:n,phone:ph,passHash:hash(pa),mpesa:code,pkg,pkgPrice:+pkg,bal:0,bonus:0,status:'pending',joinedAt:new Date().toLocaleDateString()});save();alert('Joined - wait approval');loginF(ph,pa)}
function login(){loginF(jPhone.value.trim(),jPass.value.trim())}
function loginF(ph,pa){const u=D.users.find(x=>x.phone===ph&&x.passHash===hash(pa));if(!u)return alert('wrong password/phone');U=u;D.curr=ph;save();show()}
function show(){auth.style.display='none';dash.style.display='block';uName.textContent=U.name;uPhone.textContent=U.phone;uBal.textContent=U.bal+U.bonus;render()}
function logout(){D.curr=null;save();location.reload()}
function reqW(){const amt=+wAmount.value,mp=wPhone.value.trim();if(amt<500)return alert('min 500');if((U.bal+U.bonus)<amt)return alert('low balance');D.withdraws.push({phone:U.phone,amount:amt,feeIndicated:450,mpesaPhone:mp,date:new Date().toLocaleString(),status:'pending'});U.bal-=amt;save();show();alert('Withdrawal requested: '+amt+' | Fee indicated: 450 (not deducted, info only) | You will receive '+amt)}
function render(){const myW=D.withdraws.filter(w=>w.phone===U.phone);wList.innerHTML=myW.map(w=>`${w.date}: ${w.amount} | Fee indicated ${w.feeIndicated} | To ${w.mpesaPhone} [${w.status}]`).join('<br>')}
function aLogin(){if(aPass.value!==D.adminPass)return alert('wrong admin pass');aContent.style.display='block';renderAdmin()}
function renderAdmin(){aUsers.innerHTML=D.users.map(u=>`<div class="card"><b>${u.name}</b> - ${u.phone}<br>Joined:${u.joinedAt} PKG:${u.pkg} Status:${u.status}<br>Bal:${u.bal+u.bonus} Code:${u.mpesa}<br><span style="color:green;font-weight:700">Password: ***HIDDEN & HASHED*** ✓</span></div>`).join('');aPending.innerHTML=D.users.filter(u=>u.status==='pending').map(u=>{const i=D.users.indexOf(u);return `<div class="card">${u.name} ${u.phone} <button onclick="D.users[${i}].status='active';D.users[${i}].bal=500;save();renderAdmin()">Approve</button></div>`}).join('');aW.innerHTML=D.withdraws.map(w=>{const idx=D.withdraws.indexOf(w);return `<div class="card">${w.phone} -> ${w.amount} (Fee indicated: ${w.feeIndicated}) to ${w.mpesaPhone}<br><button onclick="D.withdraws[${idx}].status='paid';save();renderAdmin()">Mark Paid</button></div>`}).join('')}
if(D.curr){const u=D.users.find(x=>x.phone===D.curr);if(u){U=u;show()}}
</script></body></html>
