<!DOCTYPE html><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#0a0e1f;color:#fff;font-family:system-ui;padding:8px}.c{background:#131a33;padding:10px;margin:6px 0;border-radius:8px}input,button{width:100%;padding:8px;margin:3px 0}button{background:#6a5cff;color:#fff;font-weight:700}.h{display:none}</style><div class="c"><h3>STARLIFE</h3><div id="s"><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="su()">SIGN UP</button><button onclick="li()">LOGIN admin/admin123</button></div><div id="m" class="h"><input id="mc" placeholder="M-PESA CODE"><button onclick="sp()">SUBMIT CODE</button></div><div id="w" class="h"><b id="wc"></b><button onclick="cs()">CHECK IF APPROVED</button></div><div id="d" class="h"><b id="hu"></b><button onclick="localStorage.clear();location.reload()">Logout</button><p id="rl" style="color:#0f0;font-size:10px"></p><div id="ad" class="h"><h4>👑 ADMIN PANEL</h4><button onclick="la()">ACTIVATIONS</button><button onclick="lw()">WITHDRAWS</button><div id="al"></div><div id="wl"></div></div><input id="wa" type="number" placeholder="Amount"><input id="wp" placeholder="Phone"><button onclick="dw()">REQUEST WITHDRAW</button><div id="wh"></div></div></div><script>
J=k=>JSON.parse(localStorage.getItem(k)||'[]'),S=(k,v)=>localStorage.setItem(k,k=='c'?v:JSON.stringify(v)),G=k=>localStorage.getItem(k)
function su(){let u=J('u'),b=u.value.trim();if(!b)return alert('user');if(u.find(x=>x.f==b))return alert('taken');u.push({f:b,pw:p.value,ac:0,paid:0,ex:4250,mc:'',ref:location.search.split('ref=')[1]});S('u',u);S('c',b);s.classList.add('h');m.classList.remove('h')}
function sp(){let u=J('u'),me=u.find(x=>x.f==G('c'));me.mc=mc.value.toUpperCase();me.paid=1;S('u',u);m.classList.add('h');w.classList.remove('h');wc.innerText=me.mc}
function cs(){let me=J('u').find(x=>x.f==G('c'));if(me.ac){w.classList.add('h');d.classList.remove('h');ld()}else alert('pending '+me.mc)}
function li(){let b=u.value.trim(),pw=p.value.trim();if(b=='admin'&&pw=='admin123'){S('c','admin');s.classList.add('h');d.classList.remove('h');ad.classList.remove('h');la();return}let u2=J('u'),f=u2.find(x=>x.f==b&&x.pw==pw);if(!f)return alert('wrong');S('c',f.f);if(!f.paid){s.classList.add('h');m.classList.remove('h')}else if(!f.ac){s.classList.add('h');w.classList.remove('h');wc.innerText=f.mc}else{s.classList.add('h');d.classList.remove('h');ld()}}
function ld(){let c=G('c');if(c=='admin'){hu.innerText='ADMIN';return}let me=J('u').find(x=>x.f==c);hu.innerText=me.f;rl.innerText=location.origin+location.pathname+'?ref='+me.f;wh.innerHTML=J('wd').filter(x=>x.user==c).map(x=>x.amt+' '+x.status).join('<br>')}
function dw(){let ws=J('wd');ws.push({id:Date.now(),user:G('c'),amt:wa.value,phone:wp.value,status:'PENDING'});S('wd',ws);alert('sent')}
function la(){let u=J('u').filter(x=>x.paid&&!x.ac);al.innerHTML=u.map(x=>x.f+' CODE:'+x.mc+' <button onclick=ap("'+x.f+'")>✅ APPROVE</button><button onclick=rj("'+x.f+'")>❌ REJECT</button>').join('<br>')||'No pending'}
function lw(){let ws=J('wd').filter(x=>x.status=='PENDING');wl.innerHTML=ws.map(x=>x.user+' KSh'+x.amt+' '+x.phone+' <button onclick=apw('+x.id+')>✅ PAY</button><button onclick=rjw('+x.id+')>❌ REJECT</button>').join('<br>')||'No pending'}
function ap(f){let u=J('u');u.find(x=>x.f==f).ac=1;S('u',u);la()}
function rj(f){S('u',J('u').filter(x=>x.f!=f));la()}
function apw(i){let w=J('wd');w.find(x=>x.id==i).status='PAID';S('wd',w);lw()}
function rjw(i){S('wd',J('wd').filter(x=>x.id!=i));lw()}
let cur=G('c');if(cur){if(cur=='admin'){d.classList.remove('h');s.classList.add('h');ad.classList.remove('h');la()}else{let me=J('u').find(x=>x.f==cur);if(me&&me.paid&&!me.ac){s.classList.add('h');w.classList.remove('h');wc.innerText=me.mc}else if(me&&me.ac){s.classList.add('h');d.classList.remove('h');ld()}}}
                                                                       </script>
