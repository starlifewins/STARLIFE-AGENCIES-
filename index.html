*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a1222;color:#fff;display:flex}
.sidebar{width:260px;background:#111c34;position:fixed;height:100vh;padding:14px 12px;border-right:1px solid #1e2e50;overflow-y:auto;z-index:20}
.logo{color:#8b7bff;font-weight:900;font-size:17px}
.sub{color:#6b7a9a;font-size:11px;margin:4px 0 18px 20px}
.item{padding:12px 14px;border-radius:10px;color:#7a8aa8;font-size:13.5px;display:flex;gap:10px;margin-bottom:3px;cursor:pointer}
.item.active{background:#5e47ff;color:#fff;font-weight:700}

.card{border-radius:16px;padding:18px;background:#111c34;border:1px solid #1e2e50}
.card h5{font-size:11px;color:#7a8aa8;letter-spacing:1px}
.card h2{font-size:26px;margin:8px 0}
.card small{font-size:11px}
.c-exp{background:linear-gradient(135deg,#3b2dd6,#5e47ff)}
.c-bal{background:linear-gradient(135deg,#1e40af,#3b82f6)}
.c-total{background:linear-gradient(135deg,#065f46,#10b981)}
.c-pending{background:linear-gradient(135deg,#92400e,#f59e0b)}
.link-box{background:#111c34;border:1px solid #1e2e50;border-radius:16px;padding:18px;margin-top:16px}
