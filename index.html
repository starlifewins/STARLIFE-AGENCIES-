<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STARLIFE</title>
<style>
body{background:#0a1128;color:#fff;font-family:Arial;margin:0;padding:0;text-align:center}
.box{padding:25px;max-width:380px;margin:auto}
input{width:100%;padding:14px;border-radius:12px;border:0;margin-top:12px;box-sizing:border-box;font-size:16px}
.btn{background:#00ff88;color:#000;border:0;width:100%;padding:15px;border-radius:12px;font-weight:bold;margin-top:18px;font-size:17px}
h1{color:#ffcc00;margin-top:40px}
</style>
</head>
<body>
<div class="box">
<h1>★ STARLIFE AGENCIES</h1>
<p>Earn by advertising</p>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<input id="ph" placeholder="Phone 07...">
<button class="btn" onclick="goActivate()">CREATE ACCOUNT</button>
</div>
<script>
function goActivate(){
var user=document.getElementById("u").value;
var pass=document.getElementById("p").value;
var phone=document.getElementById("ph").value;
if(!user||!pass||!phone){alert("Jaza zote!");return}
localStorage.clear();
localStorage.setItem("starlife_user",user);
localStorage.setItem("starlife_paid","no");
localStorage.setItem("starlife_balance","0");
localStorage.setItem("starlife_pending","0");
window.location.href="activate.html?v="+Date.now();
}
</script>
</body>
</html>
