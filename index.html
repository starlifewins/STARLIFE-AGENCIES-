<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starlife Wins</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#060a14;color:#fff;min-height:100vh}
.page{display:none;min-height:100vh;padding:20px}
.active{display:block}
.center{max-width:420px;margin:0 auto;padding-top:30px}
.logo{text-align:center;margin-bottom:25px}
.logo h1{font-size:32px;background:linear-gradient(90deg,#00f5ff,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
.logo p{opacity:0.5;font-size:13px;margin-top:5px}
.card{background:linear-gradient(135deg,rgba(255,255,255,0.07),rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.09);border-radius:18px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--c,#00f5ff)}
.card p{font-size:11px;opacity:0.55;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.card h3{font-size:24px;font-weight:800}
.card small{font-size:11px;opacity:0.5;display:block;margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.35);color:#fff;outline:none;margin-bottom:12px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,#00f5ff,#7c3aed);color:#fff;font-weight:bold;cursor:pointer;font-size:15px}
.btn2{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1)}
.linkbox{background:rgba(0,245,255,0.08);border:1px dashed rgba(0,245,255,0.3);border-radius:14px;padding:14px;text-align:center;margin-top:18px;word-break:break-all}
.linkbox a{color:#00f5ff;text-decoration:none;font-weight:bold;font-size:13px}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:10px;background:rgba(0,245,255,0.15);color:#00f5ff;margin-left:6px}
.paybox{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px;margin:16px 0}
</style>
</head>
