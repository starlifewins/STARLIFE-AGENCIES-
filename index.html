<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXTILIATE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a1222;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#111c34;border:1px solid #1e2e50;border-radius:16px;padding:20px;width:100%;max-width:360px}
.input{width:100%;padding:12px;border-radius:10px;background:#0a1222;border:1px solid #1e2e50;color:#fff;margin-top:8px}
.btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:700;margin-top:12px;cursor:pointer}
.btn-blue{background:#5e47ff;color:#fff}.btn-green{background:#10b981;color:#fff}
h2{text-align:center;margin-bottom:10px}small{color:#7a8aa8;display:block;text-align:center;margin-bottom:10px}
</style></head><body>
<div class="card">
<h2>⭐ NEXTILIATE</h2>
<small id="status">Sign up to join</small>
<div id="form">
<input id="fullname" class="input" placeholder="Full Name">
<input id="username" class="input" placeholder="Username">
<input id="phone" class="input" placeholder="Phone 07...">
<input id="mpesa" class="input" placeholder="Mpesa Code">
<input id="password" class="input" type="password" placeholder="Password">
<button class="btn btn-blue" onclick="signup()">Sign Up & Pay 550</button>
</div>
<div id="dash" style="display:none;text-align:center">
<h3 id="wel"></h3><p>Balance: KES <span id="bal">0</span></p>
<p style="color:#f59e0b" id="pend">Waiting admin approval...</p>
<button class="btn" style="background:#1e2e50;color:#fff" onclick="logout()">Logout</button>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDemo-Replace-With-Yours",
  authDomain: "starlife-demo.firebaseapp.com",
  projectId: "starlife-demo",
  storageBucket: "starlife-demo.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.signup = async()=>{
 let fullname=document.getElementById('fullname').value.trim();
 let username=document.getElementById('username').value.trim().toLowerCase();
 let phone=document.getElementById('phone').value.trim();
 let mpesa=document.getElementById('mpesa').value.trim();
 let password=document.getElementById('password').value.trim();
 if(!fullname||!username||!phone||!password){alert('Jaza kila kitu');return;}
 try{
  await setDoc(doc(db,"users",username),{
   fullname,username,phone,mpesa,password,paid:'yes',approved:'no',balance:0,created:Date.now()
  });
  localStorage.setItem('user',username);
  showDash(username);
  alert('Success! Subiri admin aku-approve');
 }catch(e){alert('Error: '+e.message+' - Badilisha Firebase config')}
}
async function showDash(username){
 let snap=await getDoc(doc(db,"users",username));
 if(!snap.exists())return;
 let x=snap.data();
 document.getElementById('form').style.display='none';
 document.getElementById('dash').style.display='block';
 document.getElementById('wel').innerText='Hi '+x.fullname;
 document.getElementById('bal').innerText=x.balance||0;
 document.getElementById('status').innerText=x.approved==='yes'?'Approved ✅':'Pending approval';
 document.getElementById('pend').style.display=x.approved==='yes'?'none':'block';
}
window.logout=()=>{localStorage.removeItem('user');location.reload();}
let saved=localStorage.getItem('user'); if(saved) showDash(saved);
</script></body></html>
