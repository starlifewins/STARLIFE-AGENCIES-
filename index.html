<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STARLIFE AGENCIES</title><style>*{box-sizing:border-box}body{background:#070a1a;color:#fff;font-family:sans-serif;margin:0}.h{background:#111;padding:14px;text-align:center;font-weight:bold;color:#ffcc00;position:sticky;top:0}.c{max-width:430px;margin:10px auto;background:#10132a;border:1px solid #252a4a;border-radius:16px;padding:16px}input{width:100%;padding:14px;margin:7px 0;border-radius:10px;border:1px solid #333;background:#0d1020;color:#fff}.b{width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;margin:6px 0}.green{background:linear-gradient(90deg,#00c853,#00e676);color:#000}.gold{background:#ffcc00;color:#000}.dark{background:#1e2030;color:#fff;border:1px solid #333}.box{background:#1a1c29;border:1px solid #252a4a;border-radius:12px;padding:12px;margin:8px 0}.hide{display:none}.badge{background:#ffcc00;color:#000;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold}.hist{font-size:12px;color:#888;border-bottom:1px solid #222;padding:6px 0;display:flex;justify-content:space-between}.big{font-size:32px;font-weight:bold;color:#ffcc00;text-align:center}</style></head><body><div class="h">★ STARLIFE AGENCIES ★</div><div class="c" id="payPage"><div style="text-align:center"><span class="badge">PAYBILL 714777</span></div><h2 style="text-align:center">Join with <span style="color:#ffcc00">KES 150</span></h2><div id="refBox" class="hide" style="background:#1f2a15;border:1px solid #3a5a20;padding:10px;border-radius:10px;text-align:center">Welcome by <b id="refBy"></b></div><div class="box"><b>Pay:</b> Paybill <b>714777</b> Acc <b>STARLIFE</b> Amt <b>150</b><br><small>Money goes to Admin 0720119990</small></div><input id="name" placeholder="Full Name"><input id="phone" placeholder="M-Pesa 07..."><button class="b green" onclick="paid()">✅ I HAVE PAID - ENTER DASHBOARD</button></div><div class="c hide" id="dashPage"><div style="display:flex;justify-content:space-between"><b>Dashboard</b><span class="badge" id="userName">USER</span></div><div class="box" style="text-align:center"><div>Your Balance</div><div class="big" id="bal">KES 50</div><small>Min withdraw 150</small></div><div class="box"><b>🔗 Your Link (100 per referral)</b><br><input id="myLink" readonly style="font-size:11px"><button class="b gold" onclick="copyLink()">📋 COPY LINK</button></div><div class="box"><b>Tasks</b><br><button class="b dark" onclick="doTask(40,'Copy')">Task 1: Copy +40</button><button class="b dark" onclick="doTask(30,'Share')">Task 2: Share WA +30</button><button class="b dark" onclick="doTask(20,'Spin')">Task 3: Spin +20</button></div><div class="box"><b>Proof History</b><div id="histList"></div></div><button class="b green" onclick="withdraw()">💸 WITHDRAW - Goes to Admin</button><button class="b dark" onclick="logout()">Logout</button></div><script>let bal=50;const owner="254720119990";function getRef(){let u=new URLSearchParams(location.search);return u.get('ref')||'0720119990'}window.onload=function(){let r=getRef();if(r!='0720119990'){document.getElementById('refBox').classList.remove('hide');document.getElementById('refBy').innerText=r}if(localStorage.getItem('sl_phone'))showDash()};function paid(){let n=document.getElementById('name').value.trim();let p=document.getElementById('phone').value.trim();if(!n||p.length<10){alert('Enter name and number');return}localStorage.setItem('sl_name',n);localStorage.setItem('sl_phone',p);localStorage.setItem('sl_bal','50');localStorage.setItem('sl_refBy',getRef());showDash()}function showDash(){document.getElementById('payPage').classList.add('hide');document.getElementById('dashPage').classList.remove('hide');bal=parseInt(localStorage.getItem('sl_bal')||'50');document.getElementById('userName').innerText=localStorage.getItem('sl_name');document.getElementById('bal').innerText='KES '+bal;document.getElementById('myLink').value=location.origin+location.pathname+'?ref='+localStorage.getItem('sl_phone');loadHist()}function copyLink(){document.getElementById('myLink').select();document.execCommand('copy');alert('Copied!');doTask(10,'Bonus')}function doTask(a,l){bal+=a;localStorage.setItem('sl_bal',bal);document.getElementById('bal').innerText='KES '+bal;let h=JSON.parse(localStorage.getItem('sl_hist')||'[]');h.push({t:l,a:a,time:new Date().toLocaleTimeString()});localStorage.setItem('sl_hist',JSON.stringify(h));loadHist()}function loadHist(){let h=JSON.parse(localStorage.getItem('sl_hist')||'[]');let html='<div class=hist><span>🎉 Welcome</span><span style=color:#00ff88>+50</span></div>';h.forEach(x=>{html+=`<div class=hist><span>${x.t} ${x.time}</span><span style=color:#00ff88>+${x.a}</span></div>`});document.getElementById('histList').innerHTML=html}function withdraw(){if(bal<150){alert('Min 150. Balance '+bal);return}let p=localStorage.getItem('sl_phone');let n=localStorage.getItem('sl_name');let msg=`*WITHDRAW*%0AName:${n}%0APhone:${p}%0AAmount:${bal}%0ARef:${localStorage.getItem('sl_refBy')}`;if(confirm(`Withdraw KES ${bal} to ${p}?`)){window.open(`https://wa.me/${owner}?text=${msg}`)}}function logout(){localStorage.clear();location.href=location.pathname}</script></body></html>
