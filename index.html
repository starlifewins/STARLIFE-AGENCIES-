<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starlife</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0b0f1e;color:#fff}.wrap{max-width:420px;margin:0 auto;padding:16px}.card{background:#131a2b;border:1px solid #1f2a44;border-radius:16px;padding:18px;margin-top:14px}.input{width:100%;padding:13px;border-radius:10px;border:1px solid #1f2a44;background:#1a233a;color:#fff;margin-bottom:10px}.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,#00e5ff,#7c3aed);color:#fff;font-weight:800}.kpi{background:#131a2b;border:1px solid #1f2a44;border-radius:16px;padding:16px;margin-top:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.tab{display:flex;gap:8px;margin-bottom:12px}.tab button{flex:1;padding:10px;border-radius:10px;border:1px solid #1f2a44;background:#131a2b;color:#888;font-weight:700}.tab button.on{background:#c9a227;color:#000}.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:18px;z-index:99}.modal.show{display:flex}.adminRow{background:#1a233a;border:1px solid #1f2a44;border-radius:10px;padding:12px;margin-top:10px;display:flex;justify-content:space-between;align-items:center}</style></head><body><div id="auth" class="wrap"><div class="card"><h3 style="color:#facc15;text-align:center" onclick="adminClick()">JOIN STARLIFE</h3><p style="opacity:.3;font-size:10px;text-align:center">Tap 5x for admin</p><div class="tab"><button id="tS" class="on" onclick="tab('s')">Sign Up</button><button id="tL" onclick="tab('l')">Log In</button></div><div id="sForm"><input id="fName" class="input" placeholder="Full Name"><input id="uName" class="input" placeholder="Username"><input id="sPhone" class="input" placeholder="Phone"><input id="sEmail" class="input" placeholder="Email"><input id="sPass" class="input" type="password" placeholder="Password"><input id="sPass2" class="input" type="password" placeholder="Confirm"><button class="btn" onclick="signup()">Sign Up</button></div><div id="lForm" class="hidden"><input id="lU" class="input" placeholder="Username or Phone"><input id="lP" class="input" type="password" placeholder="Password"><button class="btn" onclick="login()">Log In</button><p style="text-align:center;margin-top:12px;font-size:12px">Admin? <span style="color:#facc15" onclick="showAdmin()">Login</span></p></div></div></div><div id="pay" class="wrap hidden"><div class="card"><h3 style="color:#facc15;text-align:center">ACTIVATE KES 150</h3><div style="background:rgba(202,162,39,.08);border:1px solid #c9a227;border-radius:12px;padding:14px;text-align:center;margin:14px 0">Paybill: <b>714777</b><br>Acc: <b>440200282954</b><br>Amt: <b style="color:#22c55e">KES 150</b></div><input id="sCode" class="input" placeholder="M-Pesa Code"><button class="btn" onclick="submitCode()">SUBMIT</button></div></div><div id="pending" class="wrap hidden"><div class="card" style="text-align:center"><div style="font-size:48px">⏳</div><h3 style="color:#facc15">Pending</h3><p>Code <b id="pCode" style="color:#00e5ff"></b></p><button class="btn" style="background:#1f2a44;margin-top:14px" onclick="logout()">Back</button></div></div><div id="dash" class="wrap hidden"><div style="display:flex;justify-content:space-between"><div><h2>MY <span style="color:#00e5ff">DASHBOARD</span></h2><p id="dWelcome" style="color:#facc15"></p></div><button onclick="logout()" style="background:#1f2937;border:none;color:#fff;padding:8px 14px;border-radius:20px">Logout</button></div><div class="g2"><div class="kpi"><p>BALANCE</p><h2 id="bBal">KES 0</h2></div><div class="kpi"><p>EXPENSES</p><h2>KES 150</h2></div></div><div class="g2"><div class="kpi"><p>TOTAL W</p><h2 id="bTot">KES 0</h2></div><div class="kpi"><p>PENDING</p><h2 id="bPend">KES 0</h2></div></div><div class="kpi"><p>EARNINGS <span id="bRef">0 REF</span></p><h2 id="bEarn">KES 0</h2></div><div class="kpi"><button class="btn" onclick="openW()">WITHDRAW</button></div><div class="kpi" style="text-align:center"><a id="rLink" style="color:#00e5ff;font-size:12px;word-break:break-all"></a><br><br><button class="btn" onclick="copy()" style="background:#1f2a44">Copy Link</button></div></div><div id="admin" class="wrap hidden"><div class="card"><h3 style="color:#facc15;text-align:center">ADMIN PANEL</h3><div id="adminLogin"><input id="aU" class="input" value="admin"><input id="aP" class="input" value="Starlife2025"><button class="btn" onclick="adminLogin()">Login Admin</button><button class="btn" style="background:#1f2a44;margin-top:8px" onclick="hideAdmin()">Back</button></div><div id="adminDash" class="hidden"><div id="aList"></div><button class="btn" style="background:#1f2a44;margin-top:12px" onclick="logout()">Logout</button></div></div></div><div id="wM" class="modal"><div class="card" style="width:100%;max-width:360px"><h3 style="color:#facc15;text-align:center">Withdraw</h3><p>Available <b id="wAv">KES 0</b></p><input id="wAmt" class="input" type="number" placeholder="500"><input id="wPh" class="input" placeholder="0720..."><button class="btn" onclick="doW()">Confirm</button><button class="btn" style="background:#1f2a44;margin-top:8px" onclick="cW()">Cancel</button></div></div><div id="cM" class="modal"><div class="card" style="width:100%;max-width:360px;text-align:center"><div style="font-size:48px">🎉</div><h3 style="color:#22c55e">Done!</h3><p id="cMsg"></p><button class="btn" onclick="cC()">Thanks</button></div></div><script>let clicks=0;function adminClick(){clicks++;if(clicks>=5){showAdmin();clicks=0}setTimeout(()=>clicks=0,2000)}function showAdmin(){auth.classList.add('hidden');pay.classList.add('hidden');pending.classList.add('hidden');dash.classList.add('hidden');admin.classList.remove('hidden')}function hideAdmin(){admin.classList.add('hidden');auth.classList.remove('hidden')}function tab(t){sForm.classList.toggle('hidden',t!=='s');lForm.classList.toggle('hidden',t!=='l');tS.classList.toggle('on',t==='s');tL.classList.toggle('on',t==='l')}function getU(){return JSON.parse(localStorage.getItem('sl_u')||'[]')}function saveU(u){localStorage.setItem('sl_u',JSON.stringify(u))}function getC(){return JSON.parse(localStorage.getItem('sl_c')||'null')}function signup(){let fn=fName.value.trim(),un=uName.value.trim(),ph=sPhone.value.trim(),em=sEmail.value.trim(),p=sPass.value,p2=sPass2.value;if(!fn||!un||!ph||!em||!p||!p2){alert('Jaza');return}if(p!==p2){alert('Mismatch');return}let us=getU();if(us.find(x=>x.username===un)){alert('Taken');return}let nu={fullname:fn,username:un,phone:ph,email:em,password:p,balance:0,earnings:0,totalW:0,pendW:0,refs:[],activated:false,pending:false,code:'',refBy:new URLSearchParams(location.search).get('ref')||''};us.push(nu);saveU(us);localStorage.setItem('sl_t',JSON.stringify(nu));auth.classList.add('hidden');pay.classList.remove('hidden')}function submitCode(){let cd=sCode.value.trim();if(cd.length<6){alert('Code');return}let t=JSON.parse(localStorage.getItem('sl_t'));let us=getU();let me=us.find(x=>x.username===t.username);me.code=cd;me.pending=true;saveU(us);pay.classList.add('hidden');pending.classList.remove('hidden');pCode.innerText=cd}function login(){let u=lU.value.trim(),p=lP.value;if(u.toLowerCase()==='admin'){showAdmin();return}let me=getU().find(x=>(x.username===u||x.phone===u)&&x.password===p);if(!me){alert('Wrong');return}if(!me.activated){if(me.pending){auth.classList.add('hidden');pending.classList.remove('hidden');pCode.innerText=me.code;return}alert('Not activated');return}localStorage.setItem('sl_c',JSON.stringify(me));showD()}function showD(){let cur=getC();if(!cur)return;auth.classList.add('hidden');pay.classList.add('hidden');pending.classList.add('hidden');admin.classList.add('hidden');dash.classList.remove('hidden');let me=getU().find(x=>x.username===cur.username)||cur;dWelcome.innerText='Welcome, '+me.username+'!';bBal.innerText='KES '+me.balance;bEarn.innerText='KES '+me.earnings;bTot.innerText='KES '+(me.totalW||0);bPend.innerText='KES '+(me.pendW||0);bRef.innerText=me.refs.length+' REF';let link='https://starlifewins.github.io/STARLIFE-AGENCIES-/?ref='+me.username;rLink.innerText=link}function adminLogin(){adminLogin.classList;document.getElementById('adminLogin').classList.add('hidden');adminDash.classList.remove('hidden');renderAdmin()}function renderAdmin(){let us=getU();let pend=us.filter(u=>u.pending&&!u.activated);let h=pend.length===0?'<p>No pending</p>':'';pend.forEach(u=>{h+=`<div class=adminRow><div><b>${u.username}</b><br><small>${u.fullname} • ${u.phone}</small><br><small style=color:#00e5ff>Code:${u.code}</small></div><button class=btn style=width:auto;padding:8px 14px onclick="approve('${u.username}')">APPROVE</button></div>`});aList.innerHTML=h}function approve(u){let us=getU();let me=us.find(x=>x.username===u);me.activated=true;me.pending=false;if(me.refBy){let r=us.find(x=>x.username===me.refBy);if(r){r.balance+=100;r.earnings+=100;r.refs.push(me.username)}}saveU(us);alert(u+' Approved');renderAdmin()}function openW(){let me=getU().find(x=>x.username===getC().username);if(me.balance<300){alert('Min 300');return}wAv.innerText='KES '+me.balance;wM.classList.add('show')}function cW(){wM.classList.remove('show')}function doW(){let me=getU().find(x=>x.username===getC().username);let amt=parseInt(wAmt.value);let ph=wPh.value.trim();if(!amt||amt<300){alert('Min 300');return}if(amt>me.balance){alert('Haitoshi');return}me.balance-=amt;me.pendW=(me.pendW||0)+amt;me.totalW=(me.totalW||0)+amt;let us=getU();us[us.findIndex(x=>x.username===me.username)]=me;saveU(us);localStorage.setItem('sl_c',JSON.stringify(me));cW();showD();cMsg.innerText='Withdrawn KES '+amt+' to '+ph;cM.classList.add('show')}function cC(){cM.classList.remove('show')}function copy(){navigator.clipboard.writeText(rLink.innerText);alert('Copied')}function logout(){localStorage.removeItem('sl_c');location.reload()}if(getC())showD();</script></body></html>
