<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STARLIFE AGENCIES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#070d22;color:#fff;display:flex;min-height:100vh}
.sidebar{width:240px;background:#0a122c;padding:15px;position:fixed;height:100vh;overflow:auto;z-index:99}
.sidebar h2{color:#a78bfa}
.menu div{padding:12px;border-radius:8px;margin:5px 0;cursor:pointer;background:#0f1a3a}
.menu div.active,.menu div:hover{background:#6d28d9}
.main{margin-left:240px;flex:1;padding:15px}
.topbar{display:flex;justify-content:space-between;background:#0f1a3a;padding:12px;border-radius:12px;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:15px 0}
.card{padding:15px;border-radius:12px}
.c1{background:linear-gradient(135deg,#2a1a6b,#6d28d9)}.c2{background:#0f2a5a}.c3{background:#0a3d2e}.c4{background:#5a3410}.c5{background:#4a1030}
.box{background:#0f1a3a;padding:15px;border-radius:12px;margin:10px 0}
button{padding:12px;border:none;border-radius:8px;background:#6d28d9;color:#fff;font-weight:800;width:100%;margin:6px 0;cursor:pointer}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none;background:#1c2447;color:#fff}
.sec{display:none}.sec.active{display:block}
.linkbox{background:#000;padding:10px;border-radius:8px;color:#22c55e;word-break:break-all;font-size:12px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #222;font-size:13px;text-align:left}
@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:.3s;position:fixed}.sidebar.open{transform:translateX(0)}.main{margin-left:0}}
</style></head><body>
<div class="sidebar" id="side"><h2>⭐ Starlife Agencies</h2>
<div class="menu">
<div class="active" onclick="go('dash')">🏠 Dashboard</div>
<div onclick="go('profile')">👤 My Profile</div>
<div onclick="go('packages')">📦 Packages</div>
<div onclick="go('products')">🎁 Products</div>
<div onclick="go('viewers')">👁️ Viewers Report</div>
<div onclick="go('earnings')">💰 Earnings</div>
<div onclick="go('referrals')">👥 Referrals</div>
<div onclick="go('payments')">📄 Payment History</div>
<div onclick="go('support')">🎧 Support</div>
<div onclick="go('settings')">⚙️ Settings</div>
<div onclick="logout()" style="background:#3a1010;margin-top:25px">🚪 Logout</div>
</div></div>
<div class="main">
<div class="topbar"><div><span onclick="document.getElementById('side').classList.toggle('open')" style="cursor:pointer">☰ </span>Welcome, <b id="uname">Naomy</b></div><div>Starlife</div></div>

<div id="sec-dash" class="sec active">
<div class="cards">
<div class="card c1">Total Earnings<br><b id="earn">KSh 0</b></div>
<div class="card c2">Viewers<br><b id="view">0</b></div
