<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STARLIFE AGENCIES - Earn Daily</title><style>body{margin:0;background:#060a18;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:20px}.card{background:#151b2d;padding:24px;border-radius:20px;max-width:420px;width:100%;border:1px solid #f59e0b;text-align:center}input{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #2a344f;background:#0f172a;color:#fff;box-sizing:border-box}.btn{width:100%;padding:15px;border:none;border-radius:12px;font-weight:bold;cursor:pointer;margin-top:8px}.y{background:linear-gradient(90deg,#f59e0b,#ff3c00);color:#000}.g{background:#1e293b;color:#fff}</style></head><body><div class="card"><h1 style="color:#f59e0b">★ STARLIFE</h1><h3>Earn KES 500-1000 Daily</h3><p id="refShow" style="font-size:13px;color:#94a3b8">Referred by: <b id="refBy" style="color:#00ff88">Direct</b></p><input id="fullname" placeholder="Full Name"><input id="username" placeholder="Choose Username"><input id="phone" placeholder="M-Pesa 07..."><input id="pass" type="password" placeholder="Password"><input id="cpass" type="password" placeholder="Confirm Password"><button class="btn y" onclick="signup()">CREATE ACCOUNT & CONTINUE</button><button class="btn g" onclick="location.href='login.html'">Already have? Login</button></div><script>
let ref=new URLSearchParams(location.search).get('ref'); if(ref){document.getElementById('refBy').innerText=ref; document.getElementById('refShow').style.display='block';}
function signup(){let f=fullname.value.trim(),u=username.value.trim(),ph=phone.value.trim(),p=pass.value,cp=cpass.value;
if(!f||!u||!ph||!p) return alert('Jaza zote'); if(p!==cp) return alert('Password mismatch');
let users=JSON.parse(localStorage.getItem('star_users')||'[]'); if(users.find(x=>x.username.toLowerCase()===u.toLowerCase())) return alert('Username taken');
users.push({fullname:f,username:u,phone:ph,password:p,referredBy:ref||null,activated:false,time:new Date().toLocaleString()});
localStorage.setItem('star_users',JSON.stringify(users)); localStorage.setItem('current_user',u); location.href='activation.html';}
</script></body></html>
