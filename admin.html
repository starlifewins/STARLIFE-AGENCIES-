<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STARLIFE ADMIN FINAL</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:#fff;padding:12px}.card{background:#fff;color:#000;border-radius:12px;padding:12px;margin-bottom:10px}</style></head><body><div id="login" style="max-width:340px;margin:60px auto;background:#1e293b;padding:20px;border-radius:16px;text-align:center"><h3>ADMIN - STARLIFE</h3><input id="pw" type="password" placeholder="Password" style="width:100%;padding:10px;border-radius:10px;margin-top:12px"><button onclick="if(document.getElementById('pw').value==='Alfuu2024'){login.style.display='none';main.style.display='block';load()}else alert('Wrong')" style="width:100%;padding:10px;background:#7c3aed;color:#fff;border:none;border-radius:10px;margin-top:10px;font-weight:700">LOGIN</button></div><div id="main" style="display:none;max-width:600px;margin:0 auto"><h3>Pending Withdraws</h3><div id="p" style="margin-top:10px"></div><hr style="margin:15px 0;border-color:#334155"><h3>Approved</h3><div id="a" style="margin-top:10px"></div><hr style="margin:15px 0;border-color:#334155"><h3>Rejected</h3><div id="r" style="margin-top:10px"></div></div><script>function load(){let d=JSON.parse(localStorage.getItem('starlife_withdraw_requests')||'[]');let pe=d.filter(x=>x.status=='pending'),ap=d.filter(x=>x.status=='paid'),re=d.filter(x=>x.status=='rejected');document.getElementById('p').innerHTML=pe.length?pe.map(x=>`<div class=card><b>KES ${x.amount}</b> - ${x.username}<br>Phone: <b>${x.phone}</b> - ${x.name}<br><small>${x.id}</small><br><button onclick="approve('${x.id}')" style="background:green;color:#fff;padding:8px 12px;border:none;border-radius:8px;margin-top:6px">Approve</button> <button onclick="reject('${x.id}')" style="background:red;color:#fff;padding:8px 12px;border:none;border-radius:8px">Reject</button></div>`).join(''):'No pending';document.getElementById('a').innerHTML=ap.map(x=>`<div class=card>${x.username} - ${x.phone} - KES ${x.amount} - PAID</div>`).join('')||'None';document.getElementById('r').innerHTML=re.map(x=>`<div class=card>${x.username} - ${x.phone} - KES ${x.amount} - REJECTED</div>`).join('')||'None'}function approve(id){let d=JSON.parse(localStorage.getItem('starlife_withdraw_requests')||'[]');let i=d.findIndex(x=>x.id==id);d[i].status='paid';localStorage.setItem('starlife_withdraw_requests',JSON.stringify(d));load()}function reject(id){let d=JSON.parse(localStorage.getItem('starlife_withdraw_requests')||'[]');let i=d.findIndex(x=>x.id==id);d[i].status='rejected';localStorage.setItem('starlife_withdraw_requests',JSON.stringify(d));load()}</script></body></html>
