<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADMIN - NEXTILIATE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a1222;color:#fff;padding:16px}
.box{background:#111c34;border:1px solid #1e2e50;border-radius:14px;padding:16px;margin-top:12px}
.input{width:100%;padding:12px;border-radius:8px;background:#0a1222;border:1px solid #1e2e50;color:#fff;margin-top:8px}
.btn{padding:10px 16px;border-radius:8px;border:none;font-weight:700;cursor:pointer;margin-top:6px}
.btn-green{background:#10b981;color:#fff}
.btn-red{background:#ef4444;color:#fff}
.btn-blue{background:#5e47ff;color:#fff}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
th,td{padding:8px;border-bottom:1px solid #1e2e50;text-align:left}
.hidden{display:none}
.badge{padding:3px 8px;border-radius:10px;font-size:10px}
.badge-pending{background:#f59e0b;color:#000}
.badge-ok{background:#10b981}
</style>
</head>
<body>
<div id="loginBox" class="box" style="max-width:380px;margin:50px auto;text-align:center">
<h2>🔐 ADMIN LOGIN</h2>
<input id="a_user" class="input" placeholder="Username">
<input id="a_pass" class="input" type="password" placeholder="Password">
<button class="btn btn-blue" style="width:100%" onclick="adminLogin()">Login</button>
<p id="msg" style="font-size:12px;margin-top:8px"></p>
<p style="font-size:10px;color:#7a8aa8;margin-top:10px">Default: admin / admin123</p>
</div>

<div id="adminPanel" class="hidden">
<h2>⭐ ADMIN PANEL - NEXTILIATE</h2>
<p style="font-size:11px;color:#7a8aa8">Approve clients before dashboard access</p>
<div style="display:flex;gap:8px;margin-top:12px">
<button class="btn btn-blue" onclick="loadData()">🔄 Refresh</button>
<button class="btn btn-red" onclick="adminLogout()">Logout</button>
<button class="btn btn-green" onclick="window.open('https://starlifewins.github.io/STARLIFE-AGENCIES-/','_blank')">View Site</button>
</div>

<div class="box">
<h3>👥 Pending Approvals (Paid KES 200)</h3>
<table><thead><tr><th>Name</th><th>Username</th><th>Phone</th><th>Mpesa Code</th><th>Status</th><th>Action</th></tr></thead><tbody id="userTable"></tbody></table>
</div>

<div class="box">
<h3>💰 Pending Withdrawals</h3>
<table><thead><tr><th>User</th><th>Amount</th><th>Phone</th><th>Status</th><th>Action</th></tr></thead><tbody id="withdrawTable"></tbody></table>
</div>

<div class="box">
<h3>✅ All Approved Users</h3>
<div id="approvedList" style="font-size:12px;margin-top:8px"></div>
</div>
</div>

<script>
function adminLogin(){
 let u=document.getElementById('a_user').value, p=document.getElementById('a_pass').value;
 if(u=='admin' && p=='admin123'){
  localStorage.setItem('isAdmin','yes');
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('adminPanel').classList.remove('hidden');
  loadData();
 }else{document.getElementById('msg').innerText='❌ Wrong! Use admin / admin123';}
}
function adminLogout(){localStorage.removeItem('isAdmin');location.reload();}
function loadData(){
 let users=JSON.parse(localStorage.getItem('users')||'[]');
 let tb=document.getElementById('userTable'); tb.innerHTML='';
 let approvedDiv=document.getElementById('approvedList'); approvedDiv.innerHTML='';
 let countApproved=0;
 users.forEach(u=>{
  let paid=localStorage.getItem('paid_'+u.username);
  let mpesa=localStorage.getItem('mpesa_'+u.username)||'-';
  let approved=localStorage.getItem('approved_'+u.username);
  if(paid=='yes'){
   let tr=document.createElement('tr');
   tr.innerHTML=`<td>${u.fullname}</td><td>${u.username}</td><td>${u.phone}</td><td>${mpesa}</td><td><span class="badge ${approved=='yes'?'badge-ok':'badge-pending'}">${approved=='yes'?'Approved':'Pending'}</span></td><td>${approved!='yes'?`<button class="btn btn-green" onclick="approveUser('${u.username}')">Approve</button> <button class="btn btn-red" onclick="rejectUser('${u.username}')">Reject</button>`:'✅'}</td>`;
   tb.appendChild(tr);
   if(approved=='yes'){countApproved++; approvedDiv.innerHTML+=`✅ ${u.fullname} (@${u.username}) - ${u.phone} - Bal KES ${localStorage.getItem('bal_'+u.username)||0}<br>`;}
  }
 });
 if(tb.innerHTML=='') tb.innerHTML='<tr><td colspan=6 style="color:#7a8aa8;text-align:center">No paid users yet</td></tr>';
 if(approvedDiv.innerHTML=='') approvedDiv.innerHTML='No approved yet';

 // Withdrawals
 let wtb=document.getElementById('withdrawTable'); wtb.innerHTML='';
 let allHist=[];
 users.forEach(u=>{
  let hist=JSON.parse(localStorage.getItem('hist_'+u.username)||'[]');
  hist.forEach((h,i)=>{if(h.status=='Processing'&&h.phone){allHist.push({user:u.username,amt:h.amt,phone:h.phone,index:i});}});
 });
 allHist.forEach(w=>{
  let tr=document.createElement('tr');
  tr.innerHTML=`<td>${w.user}</td><td>KES ${w.amt}</td><td>${w.phone}</td><td><span class="badge badge-pending">Pending</span></td><td><button class="btn btn-green" onclick="approveWithdraw('${w.user}',${w.index})">Approve Pay</button> <button class="btn btn-red" onclick="rejectWithdraw('${w.user}',${w.index})">Reject</button></td>`;
  wtb.appendChild(tr);
 });
 if(wtb.innerHTML=='') wtb.innerHTML='<tr><td colspan=5 style="color:#7a8aa8;text-align:center">No pending withdrawals</td></tr>';
}
function approveUser(username){
 localStorage.setItem('approved_'+username,'yes');
 alert('✅ '+username+' APPROVED! Sasa anaweza ingia dashboard');
 loadData();
}
function rejectUser(username){
 if(confirm('Reject '+username+'? Itafuta payment yake')){localStorage.removeItem('paid_'+username);localStorage.removeItem('approved_'+username);localStorage.removeItem('mpesa_'+username);alert('Rejected');loadData();}
}
function approveWithdraw(user,index){
 let hist=JSON.parse(localStorage.getItem('hist_'+user)||'[]'); hist[index].status='Success'; localStorage.setItem('hist_'+user,JSON.stringify(hist));
 let pend=parseInt(localStorage.getItem('pendW_'+user))||0; let total=parseInt(localStorage.getItem('totalW_'+user))||0; let amt=hist[index].amt;
 localStorage.setItem('pendW_'+user, Math.max(0,pend-amt)); localStorage.setItem('totalW_'+user, total+amt);
 alert('✅ Withdrawal ya '+user+' KES '+amt+' Approved!'); loadData();
}
function rejectWithdraw(user,index){
 let hist=JSON.parse(localStorage.getItem('hist_'+user)||'[]'); let amt=hist[index].amt; hist.splice(index,1); localStorage.setItem('hist_'+user,JSON.stringify(hist));
 let bal=parseInt(localStorage.getItem('bal_'+user))||0; let pend=parseInt(localStorage.getItem('pendW_'+user))||0;
 localStorage.setItem('bal_'+user, bal+amt); localStorage.setItem('pendW_'+user, Math.max(0,pend-amt));
 alert('Rejected - Money returned to '+user); loadData();
}
if(localStorage.getItem('isAdmin')=='yes'){document.getElementById('loginBox').classList.add('hidden');document.getElementById('adminPanel').classList.remove('hidden');loadData();}
</script>
</body>
</html>
