<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN</title></head>
<body style="background:#020b1a;color:white;margin:0;font-family:sans-serif">
<div style="max-width:600px;margin:auto;padding:20px">
<h1 style="text-align:center">⭐ STARLIFE ADMIN</h1>
<p style="text-align:center;color:#4ade80">Direct Access - No Password Needed</p>
<div style="margin-top:20px;background:rgba(255,255,255,0.08);padding:20px;border-radius:16px">
<h3>Clients</h3>
<div id="list"></div>
<br><a href="index.html" style="color:gold">← Back</a>
</div>
</div>
<script>
function load(){
let d=JSON.parse(localStorage.getItem('starlife_users')||'[]');
let h=d.length==0?'<p style=color:#888>No clients yet</p>':'';
d.forEach((x,i)=>{h+=`<div style="background:white;color:black;padding:12px;border-radius:10px;margin-top:10px"><b>${x.name}</b> ${x.phone} ${x.amount} Code:${x.code} <button onclick="let a=JSON.parse(localStorage.getItem('starlife_users')||'[]');a.splice(${i},1);localStorage.setItem('starlife_users',JSON.stringify(a));load()" style="background:green;color:white;border:none;padding:5px 10px;border-radius:10px">Approve</button></div>`});
document.getElementById('list').innerHTML=h;
}
load();
</script>
</body>
</html>
