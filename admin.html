<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - STARLIFE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a1222;color:#fff;padding:16px}
.box{background:#111c34;border:1px solid #1e2e50;border-radius:14px;padding:14px;margin-top:12px}
.btn{padding:10px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:800;margin:4px}
.btn-green{background:#10b981;color:#fff}.btn-red{background:#ef4444;color:#fff}.btn-blue{background:#5e47ff;color:#fff}
.input{width:100%;padding:12px;border-radius:10px;background:#0a1222;border:1px solid #1e2e50;color:#fff;margin-top:8px}
</style></head><body>
<h2>⭐ STARLIFE ADMIN - FIREBASE</h2>
<p style="color:#10b981;font-size:12px">✅ Unaona clients WOTE Kenya mzima sasa</p>

<div id="loginBox" class="box">
<h3>Admin Login</h3>
<input id="u" class="input" placeholder="admin"><input id="p" class="input" type="password" placeholder="admin123">
<button class="btn btn-blue" style="width:100%;margin-top:10px" onclick="login()">Login</button>
</div>

<div id="adminBox" style="display:none">
<div class="box"><h3>📋 Pending (K200)</h3><div id="pending">Loading...</div></div>
<div class="box"><h3>✅ Approved</h3><div id="approved">Loading...</div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDEMO-REPLACE-WITH-YOURS",
  authDomain: "starlife-agencies.firebaseapp.com",
  projectId: "starlife-agencies",
  storageBucket: "starlife-agencies.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.login = function(){
let u=document.getElementById('u').value,p=document.getElementById('p').value;
if(u=='admin' && p=='admin123'){document.getElementById('loginBox').style.display='none';document.getElementById('adminBox').style.display='block';load();}
else alert('Wrong');
}

window.load = async function(){
let snap=await getDocs(collection(db,"starlife_users"));
let pend=document.getElementById('pending'); let appr=document.getElementById('approved');
pend.innerHTML=''; appr.innerHTML='';
snap.forEach(d=>{
let u=d.data(); let key=d.id;
if(u.paid=='yes' && u.approved=='no'){
let div=document.createElement('div'); div.className='box'; div.style.background='#0a1222';
div.innerHTML='<b>'+u.fullname+'</b><br>Phone:'+u.phone+'<br>Email:'+u.email+'<br>Mpesa:<b style="color:#10b981">'+u.mpesa+'</b><br><br><button class="btn btn-green" onclick="approve(\''+key+'\')">✅ Approve</button><button class="btn btn-red" onclick="reject(\''+key+'\')">Reject</button>';
pend.appendChild(div);
}
if(u.approved=='yes'){
let div=document.createElement('div'); div.className='box'; div.style.background='#0a1222';
div.innerHTML='<b>'+u.fullname+'</b> '+u.phone+'<br>'+u.email;
appr.appendChild(div);
}
});
if(pend.innerHTML=='') pend.innerHTML='No pending';
if(appr.innerHTML=='') appr.innerHTML='No approved yet';
}

window.approve = async function(key){await updateDoc(doc(db,"starlife_users",key),{approved:"yes",balance:0}); alert('Approved!'); load();}
window.reject = async function(key){await updateDoc(doc(db,"starlife_users",key),{paid:"no",approved:"no",mpesa:""}); load();}
</script></body></html>
