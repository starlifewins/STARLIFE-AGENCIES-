<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN</title>
<style>body{background:#000;color:#fff;font-family:system-ui;padding:8px}.box{background:#121a33;padding:12px;border-radius:12px;max-width:600px;margin:auto}button{padding:10px 14px;border:none;border-radius:7px;background:#6a5cff;color:#fff;font-weight:700;margin:4px}.card{background:#1e284d;padding:10px;border-radius:9px;margin:9px 0;border-left:4px solid #6a5cff}.tabs{display:flex;gap:4px}.tabs button{background:#222}.tabs button.on{background:#6a5cff}</style></head><body>
<div class="box"><h2 style="text-align:center;color:#6a5cff;margin:5px">STARLIFE ADMIN</h2>
<div class="tabs"><button id="b1" class="on" onclick="setTab('pending')">PENDING</button><button id="b2" onclick="setTab('all')">ALL JOINED</button><button id="b3" onclick="setTab('wd')">WITHDRAW</button></div>
<button onclick="location.reload()" style="width:100%;margin-top:8px">🔄 REFRESH</button>
<div id="list"></div></div>
<script>
function G(){return JSON.parse(localStorage.getItem('S')||'[]')}function SV(v){localStorage.setItem('S',JSON.stringify(v))}
let tab='pending';
function setTab(t){tab=t; document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on')); document.getElementById(t=='pending'?'b1':t=='all'?'b2':'b3').classList.add('on'); render();}
function render(){
 let all=G(); let box=document.getElementById('list');
 let list = tab=='pending'? all.filter(x=>x.paid==1 && x.ap!=1) : tab=='wd'? all.filter(x=>x.wdReq) : all;
 if(list.length==0){box.innerHTML='<p style="text-align:center;color:#888;padding:15px">No '+tab+' on this phone.<br><br>CLIENT lazima ajisajili kwa SIMU HII ndio umuone hapa.<br><small>GitHub haiunganishi simu mbili bila Firebase</small></p>';return;}
 box.innerHTML='';
 list.forEach(u=>{
  let d=document.createElement('div'); d.className='card';
  d.innerHTML='<b>'+u.f+'</b> ('+u.u+')<br>Phone:'+(u.ph||'')+'<br>Code:<b style="color:yellow">'+(u.mc||'')+'</b><br>Bal: '+(u.bal||0)+ (u.wdReq?' <br><b style="color:#ff6b6b">Wants WD: '+u.wdReq+'</b>':'')+'<br>';
  if(tab=='pending'){let b=document.createElement('button'); b.textContent='✅ APPROVE JOIN'; b.onclick=function(){let a=G();let m=a.find(x=>x.u==u.u);m.ap=1;if(m.ref){let r=a.find(x=>x.u==m.ref);if(r)r.bal=(r.bal||0)+100}SV(a);render()}; d.appendChild(b);}
  if(tab=='wd'){let b1=document.createElement('button'); b1.textContent='✅ APPROVE WD'; b1.onclick=function(){let a=G();let m=a.find(x=>x.u==u.u);m.bal=(m.bal||0)-(m.wdReq||0);m.wdReq=null;SV(a);render()}; let b2=document.createElement('button'); b2.textContent='REJECT'; b2.style.background='red'; b2.onclick=function(){let a=G();let m=a.find(x=>x.u==u.u);m.wdReq=null;SV(a);render()}; d.appendChild(b1); d.appendChild(b2);}
  if(tab=='all'){let s=document.createElement('small'); s.textContent=' Status: '+(u.ap?'Approved':'Not Approved')+' | Ref:'+(u.ref||'none'); d.appendChild(s);}
  box.appendChild(d);
 });
}
render();
</script></body></html>
