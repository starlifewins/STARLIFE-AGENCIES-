<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin STARLIFE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a1222;color:#fff;padding:14px}
.box{background:#111c34;border:1px solid #1e2e50;border-radius:12px;padding:12px;margin-top:10px}
.btn{padding:10px 14px;border-radius:8px;border:none;font-weight:800;margin:4px;cursor:pointer}
.green{background:#10b981;color:#fff}.red{background:#ef4444;color:#fff}.blue{background:#5e47ff;color:#fff}
.input{width:100%;padding:12px;border-radius:10px;background:#0a1222;border:1px solid #1e2e50;color:#fff;margin-top:8px}
</style></head><body>
<h2>⭐ STARLIFE ADMIN - WOTE KENYA</h2>
<p style="color:#10b981;font-size:12px">✅ Firebase - Unaona clients wote popote Kenya</p>

<div id="login" class="box"><h3>Login</h3><input id="u" class="input" placeholder="admin"><input id="p" class="input" type="password" placeholder="admin123"><button class="btn blue" style="width:100%;margin-top:10px" onclick="login()">Login</button></div>

<div id="admin" style="display:none">
<div class="box"><h3>📋 Pending Payments</h3><div id="pend">Loading...</div></div>
<div class="box"><h3>✅ Approved Users</h3><div id="appr">Loading...</div></div>
<button class="btn blue" onclick="load()">Refresh</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.login = function(){
if(document.getElementById('u').value=='admin' && document.getElementById('p').value=='admin123'){
document.getElementById('login').style.display='none'; document.getElementById('admin').style.display='block'; load();
} else alert('Wrong');
}

window.load = async function(){
let snap=await getDocs(collection(db,"users"));
let pend=document.getElementById('pend'); let appr=document.getElementById('appr');
pend.innerHTML=''; appr.innerHTML='';
let cP=0,cA=0;
snap.forEach(d=>{
let u=d.data(); let id=d.id;
if(u.paid=='yes' && u.approved=='no'){
cP++; let div=document.createElement('div'); div.className='box'; div.style.background='#0a1222';
div.innerHTML='<b>'+u.fullname+'</b><br>📞 '+u.phone+'<br>📧 '+u.email+'<br>💰 Mpesa: <b style="color:#10b981">'+u.mpesa+'</b><br><br><button class="btn green" onclick="approve(\''+id+'\')">✅ APPROVE</button><button class="btn red" onclick="reject(\''+id+'\')">Reject</button>';
pend.appendChild(div);
}
if(u.approved=='yes'){
cA++; let div=document.createElement('div'); div.className='box'; div.style.background='#0a1222';
div.innerHTML='✅ <b>'+u.fullname+'</b> - '+u.phone+'<br>'+u.email+' - KES '+u.balance;
appr.appendChild(div);
}
});
if(cP==0) pend.innerHTML='Hakuna pending'; if(cA==0) appr.innerHTML='Hakuna approved';
}

window.approve = async function(id){await updateDoc(doc(db,"users",id),{approved:"yes",balance:0}); alert('Approved!'); load();}
window.reject = async function(id){await updateDoc(doc(db,"users",id),{paid:"no",approved:"no",mpesa:""}); load();}
</script></body></html>
