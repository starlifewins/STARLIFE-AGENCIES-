<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN - STARLIFE</title>
<style>
body{background:#000;color:#fff;font-family:system-ui;padding:12px}
.box{background:#131a33;padding:20px;border-radius:12px;max-width:500px;margin:auto}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #333;background:#0a0e1f;color:#fff;box-sizing:border-box}
button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none;background:#6a5cff;color:#fff;font-weight:800}
.card{background:#1d264d;padding:10px;border-radius:8px;margin:8px 0}
.hide{display:none}
</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center;color:#6a5cff">STARLIFE ADMIN ONLY</h2>

<div id="loginA">
<input id="au" placeholder="Admin Username">
<input id="ap" type="password" placeholder="Admin Password">
<button id="bA">LOGIN ADMIN</button>
<p style="font-size:11px;text-align:center">Default: admin / admin123</p>
</div>

<div id="dashA" class="hide">
<h3>Pending KSh 200 Payments</h3>
<button id="bShow">🔄 REFRESH</button>
<div id="list"></div>
<button onclick="localStorage.clear();location.reload()" style="background:#333">Logout</button>
</div>
</div>

<script>
let G=()=>JSON.parse(localStorage.getItem('S')||'[]'), S=v=>localStorage.setItem('S',JSON.stringify(v));
let loginA=document.getElementById('loginA'), dashA=document.getElementById('dashA');

document.getElementById('bA').onclick=()=>{
 if(au.value.trim()=='admin' && ap.value.trim()=='admin123'){
   localStorage.setItem('ADMIN','yes');
   loginA.classList.add('hide'); dashA.classList.remove('hide');
   load();
 } else alert('Wrong admin');
};

function load(){
 let a=G(); let p=a.filter(x=>x.paid&&!x.ap);
 document.getElementById('list').innerHTML=p.map(x=>`
 <div class="card">
 <b>${x.f}</b> (${x.u})<br>
 Email: ${x.e}<br>
 Phone: ${x.ph}<br>
 CODE: <b style="color:yellow">${x.mc}</b><br>
 Ref: ${x.ref||'NONE'}<br>
 <button onclick="ap('${x.u}')">✅ APPROVE 200</button>
 <button onclick="rj('${x.u}')" style="background:#a00">❌ REJECT</button>
 </div>`).join('')||'No pending payments - hakuna mtu amelipa 200';
}

window.ap=u=>{
 let a=G(); let m=a.find(x=>x.u==u); m.ap=1;
 if(m.ref){let r=a.find(x=>x.u==m.ref); if(r) r.bal=(r.bal||0)+100}
 S(a); alert(u+' APPROVED!'); load();
};
window.rj=u=>{let a=G().filter(x=>x.u!=u); S(a); alert('Rejected'); load()};

document.getElementById('bShow').onclick=load;

if(localStorage.getItem('ADMIN')=='yes'){loginA.classList.add('hide');dashA.classList.remove('hide');load()}
</script>
</body>
</html>
