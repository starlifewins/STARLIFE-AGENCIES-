<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN 714777</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a1229;color:#fff;padding:12px}.h{background:#111d3a;padding:14px;border-radius:12px;display:flex;justify-content:space-between;margin-bottom:12px}.logo{color:#ffcc00;font-weight:900}.c{background:#111d3a;border:1px solid #1e2d5a;border-radius:12px;padding:14px;margin-bottom:12px}table{width:100%;border-collapse:collapse}th,td{padding:9px 6px;border-bottom:1px solid #1e2d5a;text-align:left;font-size:12px}th{color:#ffcc00;font-size:10px}.btn{padding:6px 10px;border-radius:6px;border:0;font-weight:700;font-size:11px;cursor:pointer;margin:2px}.b-approve{background:#4ade80;color:#000}.b-reject{background:#ff6b6b;color:#fff}.b-del{background:#2a3a6a;color:#fff}.inp{padding:10px;border-radius:8px;border:1px solid #2a3a6a;background:#0a1229;color:#fff;margin:4px 0}.badge{padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800}.badge-pending{background:#ffcc00;color:#000}.badge-approved{background:#4ade80;color:#000}.badge-rejected{background:#ff6b6b;color:#fff}</style></head><body><div class="h"><div class="logo">★ ADMIN - 714777</div><div style="font-size:11px;color:#8ea0c8">Acc 440200282954</div></div><div class="c"><h3 style="color:#ffcc00">Payments - Sort & Filter</h3><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px"><div style="background:#0a1229;padding:10px;border-radius:8px;text-align:center"><div style="font-size:10px;color:#8ea0c8">PENDING</div><div id="cP" style="font-size:20px;font-weight:900;color:#ffcc00">0</div></div><div style="background:#0a1229;padding:10px;border-radius:8px;text-align:center"><div style="font-size:10px;color:#8ea0c8">APPROVED</div><div id="cA" style="font-size:20px;font-weight:900;color:#4ade80">0</div></div><div style="background:#0a1229;padding:10px;border-radius:8px;text-align:center"><div style="font-size:10px;color:#8ea0c8">FAKE</div><div id="cR" style="font-size:20px;font-weight:900;color:#ff6b6b">0</div></div></div></div><div class="c"><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"><select id="fS" class="inp" style="width:110px" onchange="R()"><option value="all">All</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Fake</option></select><select id="sB" class="inp" style="width:130px" onchange="R()"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="code">By Code</option><option value="user">By User</option></select><input id="q" class="inp" placeholder="Search" onkeyup="R()" style="flex:1"></div><div style="overflow:auto"><table><thead><tr><th>Date</th><th>User</th><th>Code</th><th>Status</th><th>Action</th></tr></thead><tbody id="tb"></tbody></table></div><p id="em" style="text-align:center;color:#8ea0c8;margin-top:10px;display:none">Hakuna payments bado</p></div><script>function G(){return JSON.parse(localStorage.getItem('allPayments')||'[]')}function S(a){localStorage.setItem('allPayments',JSON.stringify(a))}function U(id,s){var a=G();var i=a.find(x=>x.id==id);if(i){i.status=s;S(a);R()}}function R(){var a=G();var f=fS.value;var s=sB.value;var qq=q.value.toLowerCase();if(f!='all')a=a.filter(x=>x.status==f);if(qq)a=a.filter(x=>(x.username+x.code+x.phone).toLowerCase().includes(qq));if(s=='newest')a.sort((x,y)=>y.id-x.id);if(s=='oldest')a.sort((x,y)=>x.id-y.id);if(s=='code')a.sort((x,y)=>x.code.localeCompare(y.code));if(s=='user')a.sort((x,y)=>x.username.localeCompare(y.username));cP.innerText=G().filter(x=>x.status=='pending').length;cA.innerText=G().filter(x=>x.status=='approved').length;cR.innerText=G().filter(x=>x.status=='rejected').length;tb.innerHTML='';em.style.display=a.length?'none':'block';a.forEach(p=>{var tr=document.createElement('tr');tr.innerHTML='<td style="font-size:10px;color:#8ea0c8">'+p.date+'</td><td><b>'+p.username+'</b><br><span style="font-size:10px">'+p.phone+'</span></td><td><b style="color:#ffcc00">'+p.code+'</b></td><td><span class="badge badge-'+p.status+'">'+p.status+'</span></td><td>'+(p.status=='pending'?'<button class="btn b-approve" onclick="U('+p.id+',\'approved\')">OK</button><button class="btn b-reject" onclick="U('+p.id+',\'rejected\')">FAKE</button>':'<button class="btn b-del" onclick="U('+p.id+',\'pending\')">Undo</button>')+'</td>';tb.appendChild(tr);})}R();</script></body></html>
