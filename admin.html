<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - NEXTILIATE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a1222;color:#fff;padding:16px}
.box{background:#111c34;border:1px solid #1e2e50;border-radius:14px;padding:14px;margin-top:10px}
.btn{padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:700;margin:4px}
.btn-green{background:#10b981;color:#fff}.btn-red{background:#ef4444;color:#fff}
</style>
</head>
<body>
<h2>⭐ NEXTILIATE ADMIN - NO PASSWORD</h2>
<div class="box"><h3>📋 Pending</h3><div id="pending"></div></div>
<div class="box"><h3>✅ Approved</h3><div id="approved"></div></div>
<script>
function getUsers(){return JSON.parse(localStorage.getItem('allUsers')||'{}');}
function saveUsers(u){localStorage.setItem('allUsers',JSON.stringify(u));}
function load(){let users=getUsers();let p=document.getElementById('pending'),a=document.getElementById('approved');p.innerHTML='';a.innerHTML='';let hasP=false,hasA=false;
Object.values(users).forEach(user=>{
if(user.paid=='yes'&&user.approved=='no'){hasP=true;let d=document.createElement('div');d.className='box';d.style.background='#0a1222';d.innerHTML='<b>'+user.fullname+'</b> @'+user.username+'<br>Phone:'+user.phone+' Mpesa:'+(user.mpesa||'')+'<br><button class="btn btn-green" onclick="approve(\''+user.username.toLowerCase()+'\')">Approve</button>';p.appendChild(d);}
if(user.paid=='yes'&&user.approved=='yes'){hasA=true;let d=document.createElement('div');d.className='box';d.style.background='#0a1222';d.innerHTML=user.fullname+' @'+user.username;a.appendChild(d);}
});if(!hasP)p.innerHTML='No pending';if(!hasA)a.innerHTML='No approved';}
function approve(k){let u=getUsers();u[k].approved='yes';saveUsers(u);load();}
load();
</script>
</body>
</html>
