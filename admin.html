<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADMIN - NEXTILIATE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a1222;color:#fff;padding:16px}
.box{background:#111c34;border:1px solid #1e2e50;border-radius:14px;padding:16px;margin-top:12px}
.input{width:100%;padding:12px;border-radius:8px;background:#0a1222;border:1px solid #1e2e50;color:#fff;margin-top:8px}
.btn{padding:10px 16px;border-radius:8px;border:none;font-weight:700;cursor:pointer;margin-top:6px}
.btn-green{background:#10b981;color:#fff}
.btn-red{background:#ef4444;color:#fff}
.btn-blue{background:#5e47ff;color:#fff}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
th,td{padding:8px;border-bottom:1px solid #1e2e50;text-align:left}
.hidden{display:none}
.badge{padding:3px 8px;border-radius:10px;font-size:10px}
.badge-pending{background:#f59e0b;color:#000}
.badge-ok{background:#10b981;color:#fff}
</style>
</head>
<body>

<div id="loginBox" class="box" style="max-width:380px;margin:40px auto;text-align:center">
<h2>🔐 ADMIN LOGIN</h2>
<p style="color:#7a8aa8;font-size:11px;margin:6px 0">admin / admin123</p>
<input id="a_user" class="input" placeholder="admin">
<input id="a_pass" class="input" type="password" placeholder="admin123">
<button class="btn btn-blue" style="width:100%" onclick="adminLogin()">Login</button>
<p id="msg" style="font-size:12px;margin-top:8px"></p>
</div>

<div id="adminPanel" class="hidden">
<h2>⭐ ADMIN PANEL - LOCAL</h2>
<p style="font-size:11px;color:#7a8aa8">Test kwa phone moja - Incognito = client, Normal = admin</p>
<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
<button class="btn btn-blue" onclick="loadData()">🔄 Refresh</button>
<button class="btn btn-red" onclick="adminLogout()">Logout</button>
<button class="btn btn-green" onclick="window.open('index.html','_blank')">View Site</button>
</div>

<div class="box">
<h3>👥 Pending Approvals (Paid KES 200)</h3>
<table><thead><tr><th>Name</th><th>User</th><th>Phone</th><th>Mpesa</th><th>Action</th></tr></thead><tbody id="userTable"></tbody></table>
</div>

<div class="box">
<h3>💰 Withdrawals</h3>
<div id="withdrawList"></div>
</div>

<div class="box">
<h3>✅ Approved Users</h3>
<div id="approvedList" style="font-size:12px;margin-top:8px"></div>
</div>
</div>

<script>
function adminLogin(){
 let u=document.getElementById('a_user').value, p=document.getElementById('a_pass').value;
 if(u=='admin' && p=='admin123'){
  localStorage.setItem('isAdmin','yes');
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('adminPanel').classList.remove('hidden');
  loadData();
 }else{document.getElementById('msg').innerText='❌ Wrong! Use admin / admin123';document.getElementById('msg').style.color='#ef4444';}
}
function adminLogout(){localStorage.removeItem('isAdmin');location.reload();}

function loadData(){
 let users=JSON.parse(localStorage.getItem('users')||'[]');
 let tb=document.getElementById('userTable'); tb.innerHTML='';
 let approvedDiv=document.getElementById('approvedList'); approvedDiv.innerHTML='';
 users.forEach(u=>{
  let paid=localStorage.getItem('paid_'+u.username);
  let approved=localStorage.getItem('approved_'+u.username);
  let mpesa=localStorage.getItem('mpesa_'+u.username)||'';
  if(paid=='yes' && approved!='yes'){
   let tr=document.createElement('tr');
   tr.innerHTML='<td>'+u.fullname+'</td><td>'+u.username+'</td><td>'+u.phone+'</td><td>'+mpesa+'</td><td><button class="btn btn-green" onclick="approveUser(\''+u.username+'\')">Approve</button> <button class="btn btn-red" onclick="rejectUser(\''+u.username+'\')">Reject</button></td>';
   tb.appendChild(tr);
  }else if(approved=='yes'){
   approvedDiv.innerHTML+='✅ '+u.fullname+' (@'+u.username+') - '+u.phone+' - Bal KES '+(localStorage.getItem('bal_'+u.username)||0)+'<br>';
  }
 });
 if(tb.innerHTML=='') tb.innerHTML='<tr><td colspan=5 style="color:#7a8aa8;text-align:center">No pending - Test na incognito register</td></tr>';
 if(approvedDiv.innerHTML=='') approvedDiv.innerHTML='No approved yet';

 let wDiv=document.getElementById('withdrawList'); wDiv.innerHTML='';
 users.forEach(u=>{
  let hist=JSON.parse(localStorage.getItem('hist_'+u.username)||'[]');
  hist.forEach((h,idx)=>{
   if(h.status=='Processing'){
    wDiv.innerHTML+='<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #1e2e50;font-size:12px"><span>'+u.username+' - KES '+h.amt+' - '+h.phone+'</span><span><button class="btn btn-green" style="padding:4px 8px;font-size:10px" onclick="approveWithdraw(\''+u.username+'\','+idx+','+h.amt+')">Pay</button> <button class="btn btn-red" style="padding:4px 8px;font-size:10px" onclick="rejectWithdraw(\''+u.username+'\','+idx+','+h.amt+')">Reject</button></span></div>';
   }
  });
 });
 if(wDiv.innerHTML=='') wDiv.innerHTML='<p style="color:#7a8aa8;text-align:center;font-size:11px">No pending withdrawals</p>';
}

function approveUser(username){
 localStorage.setItem('approved_'+username,'yes');
 alert('✅ '+username+' Approved! Akirudi atacheck na ataingia dashboard');
 loadData();
}
function rejectUser(username){
 if(confirm('Reject '+username+'?')){
  localStorage.setItem('paid_'+username,'no');localStorage.setItem('approved_'+username,'no');localStorage.setItem('mpesa_'+username,'');
  alert('Rejected');
  loadData();
 }
}
function approveWithdraw(username,idx,amt){
 let hist=JSON.parse(localStorage.getItem('hist_'+username)||'[]');
 if(hist[idx]){hist[idx].status='Success';localStorage.setItem('hist_'+username,JSON.stringify(hist));}
 let totalW=parseInt(localStorage.getItem('totalW_'+username)||0)+amt;
 let pendW=parseInt(localStorage.getItem('pendW_'+username)||0)-amt;if(pendW<0)pendW=0;
 localStorage.setItem('totalW_'+username,totalW);localStorage.setItem('pendW_'+username,pendW);
 alert('Withdrawal KES '+amt+' Approved!');
 loadData();
}
function rejectWithdraw(username,idx,amt){
 let hist=JSON.parse(localStorage.getItem('hist_'+username)||'[]');
 if(hist[idx]){hist[idx].status='Rejected';localStorage.setItem('hist_'+username,JSON.stringify(hist));}
 let bal=parseInt(localStorage.getItem('bal_'+username)||0)+amt;
 let pendW=parseInt(localStorage.getItem('pendW_'+username)||0)-amt;if(pendW<0)pendW=0;
 localStorage.setItem('bal_'+username,bal);localStorage.setItem('pendW_'+username,pendW);
 alert('Rejected - Money returned to '+username);
 loadData();
}
if(localStorage.getItem('isAdmin')=='yes'){document.getElementById('loginBox').classList.add('hidden');document.getElementById('adminPanel').classList.remove('hidden');loadData();}
</script>
</body>
</html>
