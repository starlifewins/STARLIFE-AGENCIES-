<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate - STARLIFE</title><style>body{margin:0;font-family:Arial;background:#f0f4ff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}.box{background:#fff;border-radius:18px;max-width:400px;width:100%;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,0.12)}.logo{font-size:22px;font-weight:bold;color:#0a7a6b;text-align:center}.logo span{color:#ffcc00}h2{text-align:center;margin:10px 0}.pay{background:#e8f5e9;border:1px solid #0a7a6b;border-radius:12px;padding:14px;margin:12px 0}.input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin-top:10px;font-size:15px;box-sizing:border-box}.btn{width:100%;padding:14px;background:#0a7a6b;color:#fff;border:0;border-radius:12px;font-weight:bold;font-size:16px;margin-top:14px}.load{display:none;text-align:center;margin-top:14px}.spinner{width:40px;height:40px;border:4px solid #ddd;border-top:4px solid #0a7a6b;border-radius:50%;animation:spin 1s linear infinite;margin:10px auto}@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="logo">★ STAR<span>LIFE</span></div><h2>Activate Account</h2><div class="pay"><div style="font-weight:bold">Lipa KES 150 ku-activate</div><div style="font-size:13px;margin-top:6px">Paybill: <b>714777</b> | Acc: <b>STARLIFE</b></div></div><label style="font-size:13px;font-weight:bold">M-PESA Number (Safaricom)</label><input id="phone" class="input" type="tel" placeholder="07XX XXX XXX"><button class="btn" onclick="stk()" id="btn1">LIPA NA M-PESA - STK PUSH</button><div id="loading" class="load"><div class="spinner"></div><div style="font-size:14px;font-weight:bold">STK Push Imetumwa!</div><div style="font-size:12px;color:#666;margin-top:6px">Angalia simu yako - Ingiza <b>M-PESA PIN</b> kwa SIM card yako ku-confirm malipo</div><div style="font-size:11px;color:#e65100;margin-top:10px" id="timer">Inasubiri... 30s</div></div><button class="btn" onclick="confirmPay()" id="btn2" style="display:none;background:#ff9800">✅ Nime-Lipa - Activate</button><div style="font-size:11px;color:#888;margin-top:12px;text-align:center">Hakuna Copy Code - Malipo ni STK direct kwa simu</div></div><script>function stk(){var p=document.getElementById('phone').value.trim();if(p.length<10){alert('Weka namba sahihi!');return;}document.getElementById('btn1').style.display='none';document.getElementById('loading').style.display='block';var t=30;var iv=setInterval(()=>{t--;document.getElementById('timer').innerText='Inasubiri... '+t+'s';if(t<=0){clearInterval(iv);document.getElementById('loading').style.display='none';document.getElementById('btn2').style.display='block';}},1000);}function confirmPay(){localStorage.setItem('starlife_paid','yes');localStorage.setItem('starlife_balance','200');alert('✅ Payment Confirmed! Account Activated');location.href='dashboard.html';}</script></body></html>
