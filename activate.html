<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>STARLIFE DASHBOARD</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f7fb;padding-bottom:20px}
.topbar{background:#009688;padding:12px;display:flex;justify-content:space-between;color:white}
.logo{font-weight:bold;font-size:20px;display:flex;gap:8px}.logo span{background:white;color:#009688;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.card-purple{background:linear-gradient(135deg,#7c5cff,#a68bff);padding:18px;border-radius:14px;color:white;margin:15px}
.mini{background:rgba(255,255,255,0.9);border-radius:10px;padding:10px 12px;flex:1;display:flex;gap:8px;color:#222}
.white-box{background:white;border-radius:12px;padding:15px;margin:15px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.balance-blue{background:linear-gradient(90deg,#2b5bff,#3ac8ff);color:white;padding:18px;border-radius:12px;margin:12px 15px;display:flex;justify-content:space-between}
.balance-orange{background:linear-gradient(90deg,#ff7a18,#ff9f3f);color:white;padding:18px;border-radius:12px;margin:12px 15px;display:flex;justify-content:space-between}
.btn-withdraw{background:#ffcc00;color:#000;border:none;padding:12px 20px;border-radius:8px;font-weight:bold;width:calc(100% - 30px);margin:0 15px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;z-index:99}
.modal-box{background:white;padding:20px;border-radius:12px;width:90%;max-width:340px}.modal-box input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
</style></head><body>
<div class="topbar"><div>☰</div><div class="logo"><span>S</span> STARLIFE</div><div>⋮</div></div>
<div class="card-purple"><div style="font-size:18px">Hi, <span id="uname">User</span> 👋</div><small>Welcome back</small></div>
<div class="balance-blue"><div><small>Available Balance</small><br><b style="font-size:26px">KES <span id="bal">0</span></b></div><div>💳</div></div>
<button class="btn-withdraw" onclick="openW()">⬆️ WITHDRAW NOW</button>
<div class="balance-orange"><div><small>Pending</small><br><b style="font-size:26px">KES <span id="pend">0</span></b></div><div>🕒</div></div>
<div class="white-box"><small>YOUR REFERRAL LINK</small><br><input id="refl" style="width:100%;padding:10px;margin-top:8px;background:#f8f9ff;border:1px solid #ddd;border-radius:6px"></div>
<div class="modal" id="mod"><div class="modal-box"><h3>Withdraw</h3><p style="color:#666;font-size:13px">Minimum 100</p><input type="number" id="amt" placeholder="Amount"><input id="ph" placeholder="Mpesa 07..."><button class="btn-withdraw" style="width:100%;margin:10px 0 0 0" onclick="doW()">Request</button><button style="width:100%;padding:10px;margin-top:8px;border:none;background:#eee;border-radius:8px" onclick="closeW()">Cancel</button></div></div>
<script>
let user=localStorage.getItem('starlife_user')||'User';
let bal=parseInt(localStorage.getItem('starlife_balance'))||0;
let pend=parseInt(localStorage.getItem('starlife_pending'))||0;
document.getElementById('uname').innerText=user;
document.getElementById('bal').innerText=bal;
document.getElementById('pend').innerText=pend;
document.getElementById('refl').value="https://starlifewins.github.io/STARLIFE-AGENCIES-/?ref="+user;
function openW(){document.getElementById('mod').style.display='flex'}
function closeW(){document.getElementById('mod').style.display='none'}
function doW(){
 let a=parseInt(document.getElementById('amt').value);
 let p=document.getElementById('ph').value;
 if(bal<=0){alert("❌ NO BALANCE!\nHuna pesa. Fanya kazi kwanza!");closeW();return}
 if(!a||a<100){alert("Minimum 100");return}
 if(a>bal){alert("❌ NO BALANCE! Balance yako ni KES "+bal);return}
 bal-=a; pend+=a;
 localStorage.setItem('starlife_balance',bal);
 localStorage.setItem('starlife_pending',pend);
 document.getElementById('bal').innerText=bal;
 document.getElementById('pend').innerText=pend;
 closeW(); alert("✅ Withdraw ya KES "+a+" imetumwa kwa "+p);
}
if(localStorage.getItem('starlife_paid')!=='yes'){window.location.href="activate.html"}
</script>
</body></html>
