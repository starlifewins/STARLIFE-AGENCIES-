<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activate - STARLIFE</title>
<style>
body{margin:0;font-family:Arial;background:#f0f4ff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
.box{background:#fff;border-radius:18px;max-width:400px;width:100%;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.logo{font-size:22px;font-weight:bold;color:#0a7a6b;text-align:center}.logo span{color:#ffcc00}
.pay{background:#fff8e1;border:1px dashed #ffb300;border-radius:12px;padding:14px;margin:12px 0}
.row{display:flex;justify-content:space-between;margin:6px 0;font-size:14px}.row span:last-child{font-weight:bold}
.input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin-top:10px;box-sizing:border-box;font-size:15px}
.btn{width:100%;padding:14px;background:#0a7a6b;color:#fff;border:0;border-radius:12px;font-weight:bold;margin-top:14px;cursor:pointer}
.btn2{background:#7a5cff}
.msg{padding:10px;border-radius:8px;font-size:13px;display:none;margin-top:10px;text-align:center}
.err{background:#ffebee;color:#c62828}.ok{background:#e8f5e9;color:#2e7d32}
</style>
</head>
<body>
<div class="box">
<div class="logo">★ STAR<span>LIFE</span></div>
<h2 style="text-align:center">Activate Account</h2>

<div class="pay">
<div style="font-weight:bold">LIPA HAPA</div>
<div class="row"><span>Paybill:</span><span>714777</span></div>
<div class="row"><span>Account:</span><span>440200282954</span></div>
<div class="row"><span>Amount:</span><span>KES 150</span></div>
</div>

<div id="err" class="msg err"></div>
<div id="ok" class="msg ok"></div>

<label style="font-size:13px;font-weight:bold">Weka PIN kutoka Admin</label>
<input id="pin" class="input" placeholder="Mf: STAR150" style="text-transform:uppercase">
<p style="font-size:11px;color:#666">Baada ya kulipa Paybill 714777 Account 440200282954, tuma screenshot kwa Admin upate PIN</p>

<button class="btn" onclick="activate()">ACTIVATE NOW</button>
<button class="btn btn2" onclick="location.href='dashboard.html'" style="margin-top:8px;background:#eee;color:#333">Rudi Dashboard</button>
</div>

<script>
var validPins = ['STAR150','STARLIFE','APPROVED','ADMIN123','440200282954','150'];

function activate(){
 var pin = document.getElementById('pin').value.trim().toUpperCase();
 var err = document.getElementById('err');
 var ok = document.getElementById('ok');
 err.style.display='none'; ok.style.display='none';
 if(!pin){
   err.innerText='Weka PIN yako!';
   err.style.display='block';
   return;
 }
 if(validPins.includes(pin) || pin.length >= 4){
   localStorage.setItem('starlife_paid','yes');
   localStorage.setItem('starlife_balance','200');
   ok.innerText='PIN Sahihi! Account Activated!';
   ok.style.display='block';
   setTimeout(function(){ location.href='dashboard.html'; },1200);
 } else {
   err.innerText='PIN si sahihi! Wasiliana na Admin';
   err.style.display='block';
 }
}
</script>
</div>
</body>
</html>
