a PIN</button></div><script>function activate(){var pin=document.getElementById('pin').value.trim().toUpperCase();var err=document.getElementById('err');var ok=document.getElementById('ok');err.style.display='none';ok.style.display='none';if(!pin){err.innerText='Weka PIN!';err.style.display='block';return;}if(pin.length>=3){localStorage.setItem('starlife_paid','yes');localStorage.setItem('starlife_balance','200');ok.innerText='✅ PIN Sahihi! Account Activated!';ok.style.display='block';setTimeout(function(){location.href='dashboard.html';},1000);}else{err.innerText='PIN si sahihi!';err.style.display='block';}}</script></body></html>
